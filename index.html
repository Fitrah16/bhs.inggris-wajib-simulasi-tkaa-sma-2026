Ingredients:
- 2 tea bags (black tea)
- 500 ml of hot water
- 3 tablespoons of sugar (adjust to taste)
- Ice cubes
- A slice of lemon (optional)

Steps:
1. Boil the water until it reaches about 90 degrees Celsius.

    title: "How to Bake Simple Banana Bread",
    type: "Procedure Text",
    body: `Banana bread is a moist, easy-to-make treat that is perfect for using up overripe bananas. Follow these steps to bake your own loaf at home.

Ingredients:
- 3 ripe bananas, mashed
- 150 g sugar
- 2 eggs
- 80 g melted butter
- 200 g all-purpose flour
- 1 teaspoon baking soda
- A pinch of salt

Steps:
1. Preheat the oven to 175 degrees Celsius and grease a loaf pan with butter.
2. In a large bowl, mash the bananas with a fork until smooth.
3. Mix in the melted butter, then add the sugar, egg, and a pinch of salt, stirring until well combined.
4. Sprinkle the baking soda over the mixture and stir it in.
5. Add the flour to the bowl and mix gently until just combined; avoid overmixing, as this can make the bread dense.
6. Pour the batter into the prepared loaf pan and smooth the top with a spatula.
7. Bake for 50 to 60 minutes, or until a toothpick inserted into the center comes out clean.
8. Remove the pan from the oven and let the bread cool for at least ten minutes before slicing.`

    type: "Procedure Text",
    body: `A flat tire is a common problem for cyclists, but it can be fixed quickly with the right tools and a few simple steps.

Materials needed:
- Tire levers
- A spare inner tube or a patch kit
- A bicycle pump
- A wrench (if the wheel is not equipped with a quick-release lever)

Steps:
1. Remove the wheel from the bicycle frame by releasing the quick-release lever or loosening the wheel nuts with a wrench.
2. Use a tire lever to pry one side of the tire off the rim, working your way around the wheel until that side of the tire is completely loose.
3. Carefully pull out the inner tube from inside the tire.
4. Check the inside of the tire for any sharp objects, such as glass or thorns, that may have caused the puncture, and remove them if found.
5. Insert the new or patched inner tube into the tire, making sure it sits evenly without any twists.
6. Push the loose side of the tire back onto the rim, ensuring the inner tube is not pinched between the tire and the rim.
7. Inflate the tire slightly to check that it holds air and sits evenly around the rim before inflating it fully to the recommended pressure.
8. Reattach the wheel to the bicycle frame and secure it firmly before riding again.`

    body: `Making a simple paper kite is a fun activity that requires only a few basic materials. Follow these steps to build your own kite.

- A sheet of lightweight paper or plastic (about 60 cm x 60 cm)
- Two thin wooden or bamboo sticks (one 60 cm long, one 50 cm long)
- String or thread
- Tape or glue
- Scissors
- Strips of cloth or paper for the tail

Steps:

2. Tie the two sticks together tightly at the point where they cross, using string, then secure with a small amount of glue if needed.
3. Cut a small notch at each end of both sticks, then run a piece of string around all four notches to form the outline of a diamond shape.
4. Place the sheet of paper flat on the ground and lay the stick frame on top of it.
5. Cut around the frame, leaving about 2 cm of extra paper on each side.
6. Fold the extra paper over the string outline and glue it down to secure the paper to the frame.
7. Attach a long tail made of cloth or paper strips to the bottom point of the kite to help it balance in the wind.
8. Tie a length of string to the point where the two sticks cross, leaving enough string to fly the kite at a safe distance.`

    type: "Report Text",
    body: `Recycling paper is an important process that helps reduce waste and conserve natural resources, particularly trees and water. Understanding how paper is recycled can help explain why this process is considered an environmentally beneficial practice.

The process begins with the collection of used paper products, such as newspapers, cardboard, and office documents, which are gathered from homes, schools, and businesses through recycling programs. Once collected, the paper is transported to a recycling facility for sorting, where different types of paper are separated based on their fiber quality and intended use.

At the recycling facility, the sorted paper is mixed with water and chemicals in a large container to break it down into a soft, pulpy mixture called slurry. This process removes ink, dyes, and any remaining contaminants such as staples or plastic coatings, resulting in a cleaner pulp that can be reused.

The cleaned pulp is then pressed and rolled into large, thin sheets, which are dried using heated rollers to remove excess water. Once dried, the resulting paper is wound into large rolls, ready to be cut and shaped into new paper products, such as newspapers, notebooks, or packaging materials.

Recycling paper offers several environmental benefits, including reduced deforestation, lower energy consumption compared to producing paper from raw materials, and decreased volume of waste sent to landfills. However, paper fibers can only be recycled a limited number of times before they become too short and weak to be reused, which is why combining recycling with responsible paper consumption remains important.`

    body: `Making yogurt at home is simple and requires only a few ingredients. Follow these steps to prepare your own batch of fresh yogurt.

Ingredients:

- 2 tablespoons of plain yogurt with live active cultures (used as a starter)

Equipment needed:
- A saucepan
- A thermometer (optional but recommended)
- A clean container with a lid
- A thick towel or blanket

5. Wrap the container in a thick towel or blanket to help maintain a warm temperature, then place it in a warm, undisturbed spot, such as inside an oven with only the oven light on.

    type: "Report Text",
    body: `A rainbow is a natural optical phenomenon that occurs when sunlight interacts with water droplets in the atmosphere, typically appearing after or during light rain when the sun is positioned behind the observer. Although rainbows appear as solid arcs of color in the sky, they are actually formed through a specific combination of light refraction, reflection, and dispersion.

When sunlight enters a water droplet, it slows down and bends, a process known as refraction. This bending separates white sunlight into its component colors, since each color of light travels at a slightly different speed within the droplet. The light then reflects off the inner surface of the droplet before exiting, bending once again as it passes back into the air.

This combination of refraction and reflection causes sunlight to spread out into the familiar spectrum of colors: red, orange, yellow, green, blue, indigo, and violet, arranged in that consistent order due to their differing wavelengths. Red light, having the longest wavelength, always appears on the outer edge of the rainbow, while violet light, with the shortest wavelength, appears on the inner edge.

Rainbows are always positioned directly opposite the sun relative to the observer, which explains why they typically appear low in the sky during midday, when the sun is high overhead, and can appear much larger and more prominent during early morning or late afternoon, when the sun is lower on the horizon.

Interestingly, no two people ever see exactly the same rainbow, since each rainbow is formed by a unique combination of light and water droplets specific to the observer's position, making every rainbow a slightly personal optical experience.`

  { id: 12, textId: "t2", type: "table", question: "Based on the text, decide whether each statement is APPROPRIATE (Tepat) or NOT APPROPRIATE (Tidak Tepat).", statements: ["Komodo National Park was created partly to protect the Komodo dragon population.","Adult Komodo dragons rely mainly on their sense of hearing to detect prey.","A Komodo dragon's tail is used only for swimming.","The Indonesian government works with international organizations to monitor Komodo dragons."], answersTable: [true,false,false,true], explanation: "(1) Tepat — paragraf 4 menyebut taman nasional dibentuk sebagai kawasan konservasi terlindungi. (2) Tidak Tepat — komodo mendeteksi bau lewat lidah bercabang, bukan pendengaran. (3) Tidak Tepat — ekor digunakan untuk keseimbangan dan pertahanan, bukan berenang. (4) Tepat — organisasi internasional terus memantau populasi komodo." },

  { id: 13, textId: "t3", type: "single", level: "C2", question: "What kind of text is this?", options: ["Narrative text","Recount text","Procedure text","Descriptive text","Analytical exposition"], answer: "C", explanation: "Teks ini berisi daftar bahan dan langkah-langkah bernomor untuk membuat sesuatu, sehingga tergolong procedure text." },
  { id: 14, textId: "t3", type: "single", level: "C3", question: "What should be done right after boiling the water?", options: ["Add the sugar","Add ice cubes","Pour the hot water over the tea bags","Add a slice of lemon","Let the tea cool to room temperature"], answer: "C", explanation: "Langkah 2 menyatakan bahwa setelah air mendidih, langkah selanjutnya adalah menuangkan air panas ke atas kantong teh yang sudah dimasukkan ke teko." },
  { id: 15, textId: "t3", type: "single", level: "C3", question: "The word 'steep' in step 3 ('Let the tea steep for about five minutes') means...", options: ["to boil something rapidly","to soak something in liquid to extract flavor","to cool something quickly","to stir something continuously","to filter something through a cloth"], answer: "B", explanation: "Dalam konteks membuat teh, 'steep' berarti merendam kantong teh dalam air panas agar rasa dan aromanya keluar, bukan berarti 'curam' seperti pada konteks lain." },
  { id: 16, textId: "t3", type: "multi", question: "Which steps must be done BEFORE the sugar is added, according to the text? (Choose TWO)", options: ["Boiling the water","Filling the glass with ice cubes","Steeping the tea bags for five minutes","Adding a slice of lemon","Cooling the tea to room temperature"], answers: ["A","C"], explanation: "Urutan langkah menunjukkan air direbus (langkah 1) dan teh diseduh selama lima menit (langkah 3) sebelum gula ditambahkan pada langkah 4. Es, lemon, dan pendinginan dilakukan setelah gula ditambahkan." },
  { id: 17, textId: "t3", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The recipe uses green tea bags.","Sugar should be added while the tea is still warm.","Adding lemon is an optional step.","The tea should be served while it is still hot."], answersTable: [false,true,true,false], explanation: "(1) Salah — resep menggunakan black tea, bukan green tea. (2) Benar — gula ditambahkan saat teh masih hangat. (3) Benar — lemon ditandai '(optional)' pada daftar bahan. (4) Salah — teh disajikan dingin dengan es batu, bukan panas." },

  { id: 18, textId: "t4", type: "single", level: "C2", question: "Who is the intended audience of this announcement?", options: ["Teachers only","Parents of students","All students of SMA Harapan Bangsa","The local environmental agency","Visitors from other schools"], answer: "C", explanation: "Pada bagian 'To:', pengumuman ini secara eksplisit ditujukan kepada seluruh siswa SMA Harapan Bangsa." },
  { id: 19, textId: "t4", type: "single", level: "C3", question: "What is required for students who want to join the recycled-craft competition?", options: ["They must bring their own gardening gloves","They must register individually, not in groups","They must register at the OSIS secretariat by 15 August 2026","They must contact the local environmental agency directly","They must attend a briefing session first"], answer: "C", explanation: "Pendaftaran lomba kerajinan daur ulang dibuka di sekretariat OSIS hingga 15 Agustus 2026." },
  { id: 20, textId: "t4", type: "single", level: "C4", question: "What can be inferred about the purpose of School Environment Day?", options: ["To raise funds for the student council","To prepare students for a national exam","To promote environmental awareness among students","To celebrate the school's anniversary","To recruit new members for OSIS"], answer: "C", explanation: "Rangkaian kegiatan serta konteks 'World Environment Day' menyiratkan tujuan acara ini adalah menumbuhkan kesadaran lingkungan." },
  { id: 21, textId: "t4", type: "multi", question: "According to the announcement, what are students required to bring? (Choose TWO)", options: ["Gardening gloves","A reusable water bottle","Recycled materials for crafting","A permission letter from parents","A copy of their student ID card"], answers: ["A","B"], explanation: "Seluruh siswa wajib membawa sarung tangan berkebun dan botol minum yang dapat digunakan kembali." },
  { id: 22, textId: "t4", type: "table", question: "Based on the announcement, decide whether each statement is TRUE or FALSE.", statements: ["The event will be held on a weekday.","The waste sorting workshop involves a local environmental agency.","The recycled-craft competition is an individual competition.","Ms. Ratna can be contacted for further information."], answersTable: [false,true,false,true], explanation: "(1) Salah — acara diadakan hari Sabtu, bukan hari kerja. (2) Benar — workshop pemilahan sampah melibatkan dinas lingkungan setempat. (3) Salah — lomba dilakukan berkelompok (3-4 siswa). (4) Benar — Ms. Ratna disebut sebagai kontak informasi." },

  { id: 23, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'reluctant'.", options: ["eager","unwilling","confident","curious","generous"], answer: "B", explanation: "'Reluctant' berarti enggan/segan melakukan sesuatu, sinonim terdekatnya adalah 'unwilling'." },
  { id: 24, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'abundant'.", options: ["plentiful","scarce","massive","fertile","ordinary"], answer: "B", explanation: "'Abundant' berarti berlimpah, sehingga lawan katanya adalah 'scarce' (langka)." },
  { id: 25, textId: null, type: "single", level: "C3", question: "She had to put off the meeting because most of the managers were on leave. The phrasal verb 'put off' means...", options: ["to cancel permanently","to postpone","to organize","to attend","to announce"], answer: "B", explanation: "'Put off' merupakan phrasal verb yang berarti menunda (postpone), bukan membatalkan secara permanen." },
  { id: 26, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The weather forecast predicted heavy rain; ____, the outdoor concert was cancelled.'", options: ["however","therefore","although","meanwhile","in contrast"], answer: "B", explanation: "Kalimat kedua merupakan akibat logis dari kalimat pertama, sehingga konektor yang tepat adalah 'therefore' yang menunjukkan hubungan sebab-akibat." },
  { id: 27, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'Maria forgot her umbrella at the office, so she had to go back to get ____.'", options: ["it","them","her","one","this"], answer: "A", explanation: "Kata ganti 'it' merujuk pada 'umbrella' (benda tunggal, bukan orang), sehingga pilihan yang tepat adalah 'it'." },
  { id: 28, textId: null, type: "single", level: "C4", question: "'Despite the heavy traffic, Andi managed to arrive at the airport on time.' What does this sentence imply?", options: ["Andi arrived late because of the traffic","The traffic did not stop Andi from being on time","Andi avoided the traffic completely","Andi missed his flight","There was no traffic that day"], answer: "B", explanation: "'Despite' menunjukkan kontras: meskipun ada kemacetan berat, Andi tetap berhasil tiba tepat waktu." },
  { id: 29, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'enormous'? (Choose TWO)", options: ["huge","tiny","massive","narrow","faint"], answers: ["A","C"], explanation: "'Enormous' berarti sangat besar, sinonimnya adalah 'huge' dan 'massive'. 'Tiny' dan 'narrow' berarti kecil/sempit, dan 'faint' berarti samar." },
  { id: 30, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The company had to call off the launch event due to the storm. [cancel]","Please look after your younger sister while I'm at work. [ignore]","He finally gave up smoking after years of trying. [stopped]","They ran into an old friend at the supermarket yesterday. [met by chance]"], answersTable: [true,false,true,true], explanation: "(1) Sesuai — 'call off' berarti membatalkan. (2) Tidak Sesuai — 'look after' berarti menjaga/merawat, bukan mengabaikan. (3) Sesuai — 'give up' berarti berhenti melakukan sesuatu. (4) Sesuai — 'run into' berarti bertemu secara tidak sengaja." }
];

QUESTIONS.push(
  { id: 31, textId: "t5", type: "single", level: "C2", question: "What is the text mainly about?", options: ["A mouse deer who wanted to become king of the forest","A mouse deer who tricked crocodiles to cross a river","A group of crocodiles hunting for a mouse deer","A fruit garden shared by forest animals","A king who ordered animals to be counted"], answer: "B", explanation: "Teks narrative ini bercerita tentang kancil yang menipu buaya-buaya agar bisa menyeberangi sungai dengan berpura-pura menghitung mereka atas perintah raja." },
  { id: 32, textId: "t5", type: "single", level: "C3", question: "The word 'furious' in paragraph 4 is closest in meaning to...", options: ["confused","very angry", "relieved", "amused", "frightened"], answer: "B", explanation: "'Furious' berarti sangat marah, sinonim terdekatnya adalah 'very angry'." },
  { id: 33, textId: "t5", type: "single", level: "C4", question: "Why did the crocodiles line up across the river?", options: ["They wanted to race each other","They believed the King of the Forest ordered them to be counted","They were guarding the fruit garden","They wanted to help the mouse deer find food","They were resting after hunting"], answer: "B", explanation: "Para buaya percaya bahwa Raja Hutan memerintahkan mereka untuk dihitung, sehingga mereka bangga dan berbaris memenuhi permintaan kancil." },
  { id: 34, textId: "t5", type: "single", level: "C4", question: "What is the moral message of the story?", options: ["Strength is more important than intelligence","One should not trust strangers who offer help","Being clever can help one overcome a difficult situation, but people should also be careful about believing everything they hear","Kings should be obeyed without question","Crossing a river is always dangerous"], answer: "C", explanation: "Cerita ini menunjukkan kecerdikan kancil dalam mengatasi situasi sulit, sekaligus pesan di akhir cerita bahwa buaya belajar untuk lebih berhati-hati sebelum percaya begitu saja pada apa yang mereka dengar." },
  { id: 35, textId: "t5", type: "multi", question: "According to the text, which of the following are TRUE? (Choose TWO)", options: ["The mouse deer wanted to reach a fruit garden across the river","The crocodiles counted the mouse deer instead of being counted","The mouse deer claimed the King of the Forest ordered the counting","The crocodiles caught the mouse deer before it reached the garden","The mouse deer swam across the river by itself"], answers: ["A","C"], explanation: "Kancil ingin mencapai kebun buah di seberang sungai, dan ia mengaku bahwa Raja Hutan memerintahkan penghitungan buaya sebagai alasan palsu untuk menipu mereka." },
  { id: 36, textId: "t5", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The mouse deer jumped on the crocodiles' backs to cross the river.","The crocodiles were happy after learning they had been tricked.","The mouse deer reached the fruit garden safely.","The King of the Forest really ordered the crocodiles to be counted."], answersTable: [true, false, true, false], explanation: "(1) Benar — kancil melompat dari punggung buaya satu ke buaya lain untuk menyeberang. (2) Salah — para buaya justru marah setelah sadar tertipu. (3) Benar — kancil berhasil mendarat dengan selamat dan masuk ke kebun buah. (4) Salah — perintah raja hanyalah kebohongan kancil untuk menipu buaya." },

  { id: 37, textId: "t6", type: "single", level: "C2", question: "What is the writer's main argument in this text?", options: ["Digital media is more useful than printed books","Reading books is still important despite the rise of digital technology","Books should be completely replaced by e-books","Social media improves concentration better than books","Reading is only necessary for students"], answer: "B", explanation: "Teks analytical exposition ini berargumen bahwa membaca buku tetap penting meskipun teknologi digital semakin berkembang, sesuai tesis pada paragraf pembuka." },
  { id: 38, textId: "t6", type: "single", level: "C3", question: "The word 'sustained' in paragraph 2 is closest in meaning to...", options: ["brief", "continuous", "occasional", "divided", "random"], answer: "B", explanation: "'Sustained focus' berarti fokus yang berkelanjutan/terus-menerus, sinonim terdekatnya adalah 'continuous'." },
  { id: 39, textId: "t6", type: "single", level: "C4", question: "What can be inferred from the statement that 'anyone can publish content on the internet without verification'?", options: ["All online information is completely false","Online information may be less reliable than published books","Books are always free of errors","The internet is not a useful source of information at all","Online publishing requires strict editing"], answer: "B", explanation: "Pernyataan tersebut menyiratkan bahwa karena tidak ada proses verifikasi, informasi daring berpotensi kurang dapat diandalkan dibandingkan buku yang melalui proses penyuntingan dan pengecekan fakta." },
  { id: 40, textId: "t6", type: "single", level: "C3", question: "According to paragraph 4, how does regular reading benefit a person?", options: ["It helps them earn more money","It enriches vocabulary and improves communication skills","It reduces the need for formal education","It replaces the need for speaking practice","It guarantees better grades in all subjects"], answer: "B", explanation: "Paragraf 4 menjelaskan bahwa membaca secara rutin memperkaya kosakata dan struktur kalimat, sehingga membantu seseorang berkomunikasi lebih efektif." },
  { id: 41, textId: "t6", type: "multi", question: "According to the text, which of the following are reasons given by the writer to support reading books? (Choose TWO)", options: ["Books improve concentration and critical thinking","Books are cheaper than digital devices","Books generally provide more reliable information than many online sources","Books can be read faster than online articles","Books are required for every job application"], answers: ["A","C"], explanation: "Argumen yang disebutkan penulis adalah buku meningkatkan konsentrasi dan berpikir kritis (paragraf 2), serta buku umumnya menyediakan informasi yang lebih dapat diandalkan dibanding banyak sumber daring (paragraf 3)." },
  { id: 42, textId: "t6", type: "table", question: "Based on the text, decide whether each statement is APPROPRIATE (Tepat) or NOT APPROPRIATE (Tidak Tepat).", statements: ["The writer believes reading books is now unnecessary because of social media.","Books generally go through editing and fact-checking before publication.","Social media posts are designed for quick consumption.","The writer suggests only professional writers should read books."], answersTable: [false, true, true, false], explanation: "(1) Tidak Tepat — penulis justru berpendapat membaca buku tetap penting. (2) Tepat — buku melalui proses penyuntingan dan pengecekan fakta. (3) Tepat — konten media sosial dirancang untuk dikonsumsi cepat. (4) Tidak Tepat — penulis menyarankan semua orang, terutama pelajar, untuk membaca." },

  { id: 43, textId: "t7", type: "single", level: "C2", question: "What is the purpose of this email?", options: ["To thank the online store for fast delivery","To ask about the store's return policy in general","To report a damaged product and request a replacement or refund","To cancel an order before it is shipped","To request a discount on a future order"], answer: "C", explanation: "Email ini ditulis untuk melaporkan produk yang rusak dan meminta penggantian atau pengembalian dana." },
  { id: 44, textId: "t7", type: "single", level: "C3", question: "What problem did Rendra find with the wireless mouse?", options: ["It was the wrong color","It had a cracked cover and did not turn on","It was missing from the package","It came with the wrong charger","It was an outdated model"], answer: "B", explanation: "Mouse yang diterima memiliki penutup retak dan sama sekali tidak menyala." },
  { id: 45, textId: "t7", type: "single", level: "C4", question: "What can be inferred about why Rendra attached photos to the email?", options: ["To show that the packaging design was attractive","To provide evidence supporting his complaint","To request a photography tutorial","To compare the product with a competitor's","To ask for a product manual"], answer: "B", explanation: "Melampirkan foto produk dan kemasan yang rusak berfungsi sebagai bukti pendukung keluhannya." },
  { id: 46, textId: "t7", type: "multi", question: "According to the email, what does Rendra request from the customer service? (Choose TWO)", options: ["A full replacement for the item","A discount coupon for his next purchase","A refund for the order","A phone call from the manager","An extended warranty"], answers: ["A","C"], explanation: "Rendra secara eksplisit meminta penggantian penuh (full replacement) atau pengembalian dana (refund)." },
  { id: 47, textId: "t7", type: "table", question: "Based on the email, decide whether each statement is TRUE or FALSE.", statements: ["Rendra received the package on the same day he ordered it.","The wireless mouse did not turn on at all.","Rendra attached photos of the damaged item.","Rendra asked for the item to be exchanged for a different product."], answersTable: [false, true, true, false], explanation: "(1) Salah — ia membeli minggu lalu dan menerima paket kemarin sore, bukan hari yang sama. (2) Benar — mouse sama sekali tidak menyala. (3) Benar — ia melampirkan foto produk dan kemasan yang rusak. (4) Salah — ia meminta penggantian item yang sama atau refund, bukan produk lain." },

  { id: 48, textId: "t8", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The history of electricity in Indonesia","The process, advantages, and limitations of solar power","A comparison between coal and natural gas","The instructions for installing a solar panel at home","Government subsidies for renewable energy"], answer: "B", explanation: "Teks report ini menjelaskan cara kerja, kelebihan, dan keterbatasan tenaga surya secara umum." },
  { id: 49, textId: "t8", type: "single", level: "C3", question: "The word 'considerable' in paragraph 4 is closest in meaning to...", options: ["insignificant", "fairly large", "temporary", "hidden", "flexible"], answer: "B", explanation: "'Considerable initial investment' berarti investasi awal yang cukup besar, sinonim terdekatnya adalah 'fairly large'." },
  { id: 50, textId: "t8", type: "single", level: "C3", question: "According to the text, what is the function of an inverter in a solar power system?", options: ["It stores excess electricity for later use","It converts DC electricity into AC electricity","It cleans the surface of the solar panel","It measures the amount of sunlight received","It protects the panel from bad weather"], answer: "B", explanation: "Inverter mengubah listrik arus searah (DC) menjadi arus bolak-balik (AC) untuk digunakan di rumah tangga atau industri." },
  { id: 51, textId: "t8", type: "multi", question: "According to the text, which of the following are limitations of solar power? (Choose TWO)", options: ["It depends heavily on weather conditions","It produces harmful emissions during operation","It requires a considerable initial investment","Sunlight is a limited resource that will eventually run out","It cannot be used in any country"], answers: ["A","C"], explanation: "Dua keterbatasan utama: efisiensinya sangat bergantung pada cuaca, dan pemasangan sistem panel surya membutuhkan investasi awal yang cukup besar." },
  { id: 52, textId: "t8", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Solar panels produce direct emissions during operation.","Sunlight is considered a renewable resource.","Solar energy production can drop on cloudy days.","The cost of solar panel installation has been increasing over the past decade."], answersTable: [false, true, true, false], explanation: "(1) Salah — tenaga surya tidak menghasilkan emisi langsung. (2) Benar — sinar matahari adalah sumber daya terbarukan. (3) Benar — produksi energi bisa menurun signifikan saat mendung. (4) Salah — biaya pemasangan justru menurun bertahap." },

  { id: 53, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'essential'.", options: ["optional", "crucial", "outdated", "flexible", "temporary"], answer: "B", explanation: "'Essential' berarti sangat penting/mendasar, sinonim terdekatnya adalah 'crucial'." },
  { id: 54, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'reliable'.", options: ["trustworthy", "consistent", "untrustworthy", "accurate", "stable"], answer: "C", explanation: "'Reliable' berarti dapat diandalkan, sehingga lawan katanya adalah 'untrustworthy'." },
  { id: 55, textId: null, type: "single", level: "C3", question: "The team had to carry out the experiment again after the first result seemed inaccurate. The phrasal verb 'carry out' means...", options: ["to cancel", "to perform or conduct", "to postpone", "to observe", "to summarize"], answer: "B", explanation: "'Carry out' berarti melaksanakan atau menjalankan sesuatu, seperti sebuah eksperimen atau rencana." },
  { id: 56, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The bridge was closed for repairs; ____, drivers had to take a longer route.'", options: ["consequently", "similarly", "for example", "in other words", "on the other hand"], answer: "A", explanation: "Kalimat kedua merupakan akibat dari penutupan jembatan, sehingga konektor yang tepat adalah 'consequently'." },
  { id: 57, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The students submitted their projects on Friday because ____ teacher required an early deadline.'", options: ["they", "their", "them", "it", "those"], answer: "B", explanation: "Kata ganti kepemilikan 'their' digunakan untuk menunjukkan 'guru mereka', sesuai subjek jamak 'the students'." },
  { id: 58, textId: null, type: "single", level: "C4", question: "'Although the instructions were unclear, most participants managed to complete the task correctly.' What does this sentence imply?", options: ["The unclear instructions prevented participants from finishing the task","Most participants succeeded despite the unclear instructions","The task was cancelled due to unclear instructions","All participants failed to complete the task","The instructions were rewritten before the task began"], answer: "B", explanation: "'Although' menunjukkan kontras: meskipun instruksinya tidak jelas, sebagian besar peserta tetap berhasil menyelesaikan tugas dengan benar." },
  { id: 59, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'accurate'? (Choose TWO)", options: ["precise", "vague", "correct", "careless", "uncertain"], answers: ["A","C"], explanation: "'Accurate' berarti tepat/akurat, sinonimnya adalah 'precise' dan 'correct'." },
  { id: 60, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The manager decided to bring up the issue during the meeting. [raise a topic]","She turned down the job offer because the salary was too low. [accepted]","The company plans to roll out the new product next month. [launch]","He always looks up to his older brother as a role model. [admires]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'bring up' berarti mengangkat suatu topik. (2) Tidak Sesuai — 'turn down' berarti menolak, bukan menerima. (3) Sesuai — 'roll out' berarti meluncurkan sesuatu. (4) Sesuai — 'look up to' berarti mengagumi seseorang sebagai panutan." }
);

QUESTIONS.push(
  { id: 61, textId: "t9", type: "single", level: "C2", question: "What is the text mainly about?", options: ["A description of a village in Central Java","The writer's experience volunteering to help rebuild a village school","A guide on how to organize a volunteer program","A comparison between city life and village life","An announcement about a school volunteering program"], answer: "B", explanation: "Teks recount ini menceritakan pengalaman pribadi penulis mengikuti program relawan untuk membantu membangun kembali sekolah di desa terdampak banjir." },
  { id: 62, textId: "t9", type: "single", level: "C3", question: "The word 'assigned' in paragraph 2 is closest in meaning to...", options: ["forbidden", "given a specific task", "rewarded", "warned", "excused"], answer: "B", explanation: "'Assigned' berarti diberikan tugas tertentu, sinonim terdekatnya adalah 'given a specific task'." },
  { id: 63, textId: "t9", type: "single", level: "C4", question: "What can be inferred about the writer's feelings when leaving the village?", options: ["The writer felt relieved to finally go home","The writer felt bored throughout the trip","The writer found saying goodbye emotionally difficult","The writer regretted joining the program","The writer was indifferent about leaving"], answer: "C", explanation: "Mengucapkan selamat tinggal lebih berat dari yang diperkirakan, dan beberapa anak menangis — ini menyiratkan momen tersebut cukup mengharukan." },
  { id: 64, textId: "t9", type: "single", level: "C3", question: "According to the text, what did the villagers teach the students?", options: ["How to cook traditional food","How to mix cement and fix wooden frames","How to plant rice in the fields","How to swim across the river","How to read the local dialect"], answer: "B", explanation: "Penduduk desa mengajarkan cara mencampur semen dengan benar dan menunjukkan cara tradisional memperbaiki bingkai kayu." },
  { id: 65, textId: "t9", type: "multi", question: "According to the text, which of the following tasks were done by the students? (Choose TWO)", options: ["Repainting classroom walls", "Teaching the villagers how to swim", "Fixing broken window frames", "Building a new school building from scratch", "Organizing a cooking competition"], answers: ["A","C"], explanation: "Kelompok penulis ditugaskan mengecat ulang dinding kelas dan memperbaiki bingkai jendela yang rusak." },
  { id: 66, textId: "t9", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The volunteer program lasted for three days.", "The students traveled to the village by train.", "A reading corner was set up using donated books.", "The villagers did not help the students at all during the program."], answersTable: [true, false, true, false], explanation: "(1) Benar — program berlangsung tiga hari. (2) Salah — mereka naik bus, bukan kereta. (3) Benar — sudut baca dibuat dengan buku sumbangan. (4) Salah — penduduk desa justru membantu para siswa." },

  { id: 67, textId: "t10", type: "single", level: "C2", question: "What is the main topic of this text?", options: ["Methods for recycling plastic waste","How plastic pollution affects marine animals and ecosystems","The history of plastic production","Government policies on fishing regulations","The benefits of using plastic in daily life"], answer: "B", explanation: "Teks report ini membahas berbagai dampak polusi plastik terhadap hewan laut dan ekosistemnya." },
  { id: 68, textId: "t10", type: "single", level: "C3", question: "The word 'entanglement' in paragraph 2 is closest in meaning to...", options: ["being trapped or caught in something","being poisoned by chemicals","being separated from a group","being unable to reproduce","being exposed to sunlight"], answer: "A", explanation: "'Entanglement' merujuk pada kondisi terjerat atau terperangkap, misalnya hewan laut yang terjerat jaring atau plastik." },
  { id: 69, textId: "t10", type: "single", level: "C4", question: "Why do sea turtles often ingest plastic bags?", options: ["They are attracted to bright colors","They mistake plastic bags for jellyfish, their natural prey","They eat anything floating on the water surface","They are trained to eat plastic by researchers","They cannot see clearly underwater"], answer: "B", explanation: "Penyu laut sering keliru mengira kantong plastik yang mengambang sebagai ubur-ubur, mangsa alami mereka." },
  { id: 70, textId: "t10", type: "single", level: "C4", question: "What can be inferred from the statement that microplastics 'enter the marine food chain'?", options: ["Microplastics only affect plankton and no other organisms","Microplastics can potentially reach humans through seafood consumption","Microplastics are completely harmless to larger fish","Microplastics disappear once they reach the ocean floor","Microplastics are only found in freshwater rivers"], answer: "B", explanation: "Mikroplastik berpindah dari plankton ke ikan yang lebih besar, hingga akhirnya berpotensi sampai ke manusia yang mengonsumsi makanan laut." },
  { id: 71, textId: "t10", type: "multi", question: "According to the text, which of the following are measures taken to reduce plastic pollution? (Choose TWO)", options: ["Banning single-use plastic bags and straws","Increasing plastic production for economic growth","Launching public campaigns on responsible waste disposal","Removing all fishing activities in the ocean","Building more factories near coastal areas"], answers: ["A","C"], explanation: "Langkah-langkah yang disebut: melarang kantong plastik dan sedotan sekali pakai, serta kampanye publik tentang pembuangan sampah yang bertanggung jawab." },
  { id: 72, textId: "t10", type: "table", question: "Based on the text, decide whether each statement is APPROPRIATE (Tepat) or NOT APPROPRIATE (Tidak Tepat).", statements: ["Plastic entanglement can restrict an animal's movement or cause injury.","Microplastics are too large to be eaten by marine animals.","Scientists have fully understood the long-term effects of microplastics on humans.","Reducing plastic pollution requires cooperation on a global scale."], answersTable: [true, false, false, true], explanation: "(1) Tepat. (2) Tidak Tepat — mikroplastik justru berukuran kecil dan sering tertelan. (3) Tidak Tepat — ilmuwan masih mempelajari dampak jangka panjangnya. (4) Tepat — diperlukan kerja sama global." },

  { id: 73, textId: "t11", type: "single", level: "C2", question: "What kind of text is this?", options: ["Narrative text", "Report text", "Procedure text", "Recount text", "Analytical exposition"], answer: "C", explanation: "Teks ini memuat daftar bahan dan langkah bernomor untuk mendirikan tenda, tergolong procedure text." },
  { id: 74, textId: "t11", type: "single", level: "C3", question: "According to the text, what should be avoided when choosing a spot to pitch a tent?", options: ["Areas near a water source", "Low-lying ground where water might collect", "Areas with strong wind", "Flat and dry ground", "Areas close to other tents"], answer: "B", explanation: "Disarankan menghindari tempat rendah yang berpotensi tergenang air saat hujan." },
  { id: 75, textId: "t11", type: "single", level: "C3", question: "What is the purpose of the ground sheet, according to the text?", options: ["To decorate the campsite", "To protect the tent floor from moisture and sharp objects", "To attach the rainfly", "To measure the size of the tent", "To replace the tent poles"], answer: "B", explanation: "Alas tanah berfungsi melindungi lantai tenda dari kelembapan dan benda tajam." },
  { id: 76, textId: "t11", type: "multi", question: "Which of the following steps should be done BEFORE securing the tent with stakes, according to the text? (Choose TWO)", options: ["Laying the ground sheet on the chosen spot", "Attaching the rainfly", "Assembling the tent poles", "Checking that the zippers move smoothly", "Storing equipment inside the tent"], answers: ["A","C"], explanation: "Alas tanah dipasang dan tiang tenda dirakit sebelum tenda diamankan dengan pasak." },
  { id: 77, textId: "t11", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["A mallet or heavy rock can be used to hammer in the stakes.","The rainfly should be attached before the tent poles are assembled.","The tent should be checked for stability before storing equipment inside.","The text recommends pitching a tent near low-lying ground for easy water access."], answersTable: [true, false, true, false], explanation: "(1) Benar. (2) Salah — rainfly dipasang setelah tiang tenda dirakit dan tenda berdiri. (3) Benar. (4) Salah — teks justru menyarankan menghindari tempat rendah." },

  { id: 78, textId: "t12", type: "single", level: "C2", question: "What is the purpose of this announcement?", options: ["To announce a new library membership fee", "To inform students about extended library hours during Exam Week", "To invite students to a book fair", "To announce the closing of the school library", "To introduce new library staff"], answer: "B", explanation: "Pengumuman ini menginformasikan perpanjangan jam operasional perpustakaan selama Pekan Ujian." },
  { id: 79, textId: "t12", type: "single", level: "C3", question: "According to the announcement, what time does the library close on Friday during Exam Week?", options: ["16.00", "18.00", "06.30", "20.00", "17.00"], answer: "A", explanation: "Pada hari Jumat, perpustakaan tutup pukul 16.00, berbeda dari Senin-Kamis yang tutup pukul 18.00." },
  { id: 80, textId: "t12", type: "single", level: "C4", question: "What can be inferred about why students need to bring their student ID card to the library?", options: ["It is required for entering the school building","It is required to borrow books or use group study rooms","It is required to buy food inside the library","It is required to access the internet","It is required to take the mid-semester examination"], answer: "B", explanation: "Kartu pelajar diperlukan untuk meminjam buku atau menggunakan ruang belajar kelompok." },
  { id: 81, textId: "t12", type: "multi", question: "According to the announcement, which of the following are TRUE? (Choose TWO)", options: ["Group study rooms can be used without prior booking during Exam Week","Food and drinks of any kind are allowed inside the library","Additional printed past-year exam papers will be available at the reference desk","The extended library hours apply throughout the entire semester","Only Grade 12 students may use the extended hours"], answers: ["A","C"], explanation: "Ruang belajar kelompok dapat digunakan tanpa pemesanan, dan soal ujian tahun-tahun sebelumnya disediakan di meja referensi." },
  { id: 82, textId: "t12", type: "table", question: "Based on the announcement, decide whether each statement is TRUE or FALSE.", statements: ["The extended library hours start on Monday, 24 August 2026.","Water is not allowed inside the library.","Group study rooms are available on a first-come, first-served basis.","This announcement is issued by the Student Council (OSIS)."], answersTable: [true, false, true, false], explanation: "(1) Benar. (2) Salah — air minum tetap diperbolehkan. (3) Benar. (4) Salah — dikeluarkan oleh Perpustakaan Sekolah, bukan OSIS." },

  { id: 83, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'inevitable'.", options: ["avoidable", "unavoidable", "unlikely", "optional", "temporary"], answer: "B", explanation: "'Inevitable' berarti tidak dapat dihindari, sinonim terdekatnya adalah 'unavoidable'." },
  { id: 84, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'genuine'.", options: ["authentic", "real", "fake", "sincere", "original"], answer: "C", explanation: "'Genuine' berarti asli/tulus, sehingga lawan katanya adalah 'fake'." },
  { id: 85, textId: null, type: "single", level: "C3", question: "The committee decided to call off the outdoor event due to the storm warning. The phrasal verb 'call off' means...", options: ["to reschedule", "to cancel", "to announce", "to begin", "to celebrate"], answer: "B", explanation: "'Call off' berarti membatalkan sesuatu." },
  { id: 86, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'Renewable energy sources are becoming more affordable; ____, more households are switching to solar panels.'", options: ["as a result", "in spite of this", "for instance", "on the contrary", "nevertheless"], answer: "A", explanation: "Kalimat kedua merupakan akibat logis dari kalimat pertama, sehingga konektor yang tepat adalah 'as a result'." },
  { id: 87, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The scientists published their findings, and ____ were widely discussed in the media.'", options: ["it", "he", "they", "this", "those"], answer: "C", explanation: "Kata ganti 'they' merujuk pada 'their findings' yang bersifat jamak." },
  { id: 88, textId: null, type: "single", level: "C4", question: "'Even though the exam was extremely difficult, Rina remained calm throughout the test.' What does this sentence imply?", options: ["Rina panicked because the exam was difficult","Rina managed to stay calm despite the difficulty of the exam","The exam was cancelled because it was too difficult","Rina did not take the exam at all","The exam was easier than expected"], answer: "B", explanation: "'Even though' menunjukkan kontras: meskipun ujiannya sangat sulit, Rina tetap tenang." },
  { id: 89, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'sufficient'? (Choose TWO)", options: ["adequate", "insufficient", "enough", "scarce", "limited"], answers: ["A","C"], explanation: "'Sufficient' berarti cukup, sinonimnya adalah 'adequate' dan 'enough'." },
  { id: 90, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The teacher asked the students to hand in their assignments by Friday. [submit]","She decided to give in to her friend's request even though she disagreed. [refuse]","The company had to cut down on unnecessary expenses last year. [reduce]","He tends to put off important decisions until the last minute. [delay]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'hand in' berarti menyerahkan. (2) Tidak Sesuai — 'give in' berarti mengalah, bukan menolak. (3) Sesuai — 'cut down on' berarti mengurangi. (4) Sesuai — 'put off' berarti menunda." }
);

QUESTIONS.push(
  { id: 91, textId: "t13", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The daily routine of a lighthouse keeper","A lighthouse keeper who breaks the rules to rescue fishermen during a storm","The history of lighthouses along the northern coast","A conflict between a lighthouse keeper and his supervisor","A description of a dangerous strait"], answer: "B", explanation: "Teks narrative ini bercerita tentang penjaga mercusuar yang meninggalkan posnya untuk menyelamatkan nelayan meskipun ada aturan yang melarangnya." },
  { id: 92, textId: "t13", type: "single", level: "C3", question: "The word 'struggling' in paragraph 1 is closest in meaning to...", options: ["sailing smoothly", "having serious difficulty", "waiting patiently", "moving quickly", "sinking immediately"], answer: "B", explanation: "'Struggling' berarti mengalami kesulitan besar, sesuai konteks perahu nelayan yang mesinnya rusak di tengah badai." },
  { id: 93, textId: "t13", type: "single", level: "C4", question: "What can be inferred about Mr. Harun's character from his decision to leave his post?", options: ["He was careless about following rules", "He valued human life more than strictly following procedure", "He wanted to be praised by his supervisor", "He did not understand the risk of leaving the lighthouse", "He panicked and acted without thinking"], answer: "B", explanation: "Meskipun tahu aturannya, Mr. Harun tetap memilih menyelamatkan nelayan, menunjukkan ia menilai keselamatan manusia lebih penting daripada mengikuti prosedur secara kaku." },
  { id: 94, textId: "t13", type: "single", level: "C3", question: "What did Mr. Harun do before leaving the lighthouse to help the fishermen?", options: ["He called for help using a radio", "He set the lamp on its automatic backup mechanism", "He turned off the lighthouse completely", "He waited for the storm to pass first", "He asked his supervisor for permission"], answer: "B", explanation: "Sebelum turun ke dermaga, ia mengatur lampu mercusuar ke mekanisme cadangan otomatis agar tetap menyala." },
  { id: 95, textId: "t13", type: "multi", question: "According to the text, which of the following happened in the story? (Choose TWO)", options: ["Mr. Harun rescued two fishermen using a rope", "The supervisor punished Mr. Harun for leaving his post", "The fishing boat was destroyed on the rocks after the rescue", "Mr. Harun ignored the storm and stayed inside the lighthouse", "A new keeper replaced Mr. Harun after the incident"], answers: ["A","C"], explanation: "Mr. Harun berhasil menyelamatkan dua nelayan menggunakan tali, dan perahu mereka hancur menabrak batu karang setelah penyelamatan." },
  { id: 96, textId: "t13", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Mr. Harun lived on the island together with his family.", "The supervisor was angry at Mr. Harun for leaving his post.", "A more reliable backup system was installed after the incident.", "The fishermen were saved just before their boat sank."], answersTable: [false, false, true, true], explanation: "(1) Salah — ia tinggal sendirian di pulau tersebut. (2) Salah — supervisor justru mengatakan ia membuat keputusan yang tepat. (3) Benar — mercusuar dilengkapi sistem cadangan yang lebih andal. (4) Benar — para nelayan diselamatkan tepat sebelum perahu mereka tenggelam." },

  { id: 97, textId: "t14", type: "single", level: "C2", question: "What is the writer's main argument in this text?", options: ["English should be the only language taught in schools","Learning a second language offers significant cognitive, career, and cultural benefits","Bilingual people always perform better academically than monolingual people","Learning a second language is only useful for international careers","Translators will soon become unnecessary due to technology"], answer: "B", explanation: "Teks analytical exposition ini berargumen bahwa mempelajari bahasa kedua memberikan manfaat kognitif, karier, dan budaya yang signifikan." },
  { id: 98, textId: "t14", type: "single", level: "C3", question: "The word 'competitive' in paragraph 3 is closest in meaning to...", options: ["unnecessary", "advantageous", "outdated", "temporary", "risky"], answer: "B", explanation: "'Competitive advantage' berarti keunggulan yang menguntungkan, sinonim terdekatnya adalah 'advantageous'." },
  { id: 99, textId: "t14", type: "single", level: "C4", question: "What can be inferred from the statement that 'language and culture are closely connected'?", options: ["Learning a language automatically makes someone fluent in another culture's traditions","Understanding a language can help a person understand the culture behind it more deeply","Culture has no relationship with the language people speak","Only native speakers can understand their own culture","Language learning is unrelated to cultural values"], answer: "B", explanation: "Pernyataan ini menyiratkan penguasaan suatu bahasa membantu seseorang memahami budaya di baliknya secara lebih mendalam, bukan otomatis menjadikannya ahli budaya tersebut." },
  { id: 100, textId: "t14", type: "single", level: "C3", question: "According to paragraph 2, why do bilingual individuals tend to have better cognitive abilities?", options: ["Because they study harder than monolingual individuals","Because switching between languages constantly exercises the brain","Because they usually have higher levels of education","Because they read more books than monolingual individuals","Because they are naturally more intelligent"], answer: "B", explanation: "Berpindah-pindah antar bahasa secara terus-menerus melatih fungsi otak secara keseluruhan." },
  { id: 101, textId: "t14", type: "multi", question: "According to the text, which of the following are benefits of learning a second language mentioned by the writer? (Choose TWO)", options: ["Improved memory and problem-solving skills","Guaranteed higher salary in any profession","Wider career opportunities in international companies","Automatic fluency in a third language","Reduced need for formal education"], answers: ["A","C"], explanation: "Manfaat yang disebutkan meliputi peningkatan daya ingat dan kemampuan memecahkan masalah, serta peluang karier yang lebih luas di perusahaan internasional." },
  { id: 102, textId: "t14", type: "table", question: "Based on the text, decide whether each statement is APPROPRIATE (Tepat) or NOT APPROPRIATE (Tidak Tepat).", statements: ["The writer believes English is the only language worth learning.","Bilingual individuals often have better multitasking abilities.","Knowing a second language can improve a person's career prospects.","The writer discourages students from learning additional languages."], answersTable: [false, true, true, false], explanation: "(1) Tidak Tepat — penulis mendukung pembelajaran bahasa kedua secara umum. (2) Tepat. (3) Tepat. (4) Tidak Tepat — penulis mendorong siswa mempelajari bahasa tambahan sejak dini." },

  { id: 103, textId: "t15", type: "single", level: "C2", question: "What is the purpose of this email?", options: ["To announce the closing of the school", "To invite alumni to a gathering event", "To request donations for school renovation", "To inform alumni about exam results", "To advertise a job vacancy"], answer: "B", explanation: "Email ini bertujuan mengundang para alumni untuk menghadiri acara reuni alumni." },
  { id: 104, textId: "t15", type: "single", level: "C3", question: "According to the email, what should alumni do by 5 September 2026?", options: ["Pay the registration fee", "Confirm their attendance through the registration form", "Submit a career presentation", "Donate to the scholarship fund", "Contact the Alumni Association by phone"], answer: "B", explanation: "Para alumni diminta mengonfirmasi kehadiran melalui formulir pendaftaran paling lambat 5 September 2026." },
  { id: 105, textId: "t15", type: "single", level: "C4", question: "What can be inferred about the scholarship fund mentioned in the email?", options: ["It is mandatory for all alumni to contribute","It is a new initiative being launched during the event","It has been running successfully for several years","It is only open to current students, not alumni","It replaces the need for alumni registration fees"], answer: "B", explanation: "Rencana meluncurkan dana beasiswa kecil mengindikasikan ini adalah inisiatif baru pada acara tersebut." },
  { id: 106, textId: "t15", type: "multi", question: "According to the email, which of the following activities are included in the event? (Choose TWO)", options: ["A campus tour", "A formal exam for alumni", "A performance by current students", "A job interview session", "A fundraising concert"], answers: ["A","C"], explanation: "Acara ini mencakup tur kampus dan pertunjukan singkat oleh siswa yang sedang bersekolah." },
  { id: 107, textId: "t15", type: "table", question: "Based on the email, decide whether each statement is TRUE or FALSE.", statements: ["There is a mandatory registration fee for the event.","The event will take place at the school hall.","Alumni are required to donate to the scholarship fund.","The event is intended for alumni of Batch 2016-2019."], answersTable: [false, true, false, true], explanation: "(1) Salah — tidak ada biaya pendaftaran wajib. (2) Benar. (3) Salah — donasi bersifat opsional. (4) Benar." },

  { id: 108, textId: "t16", type: "single", level: "C2", question: "What is the text mainly about?", options: ["How honey is produced by bees", "The role of honey bees in pollination and its importance to food production", "The history of beekeeping around the world", "How to start a honey bee farm", "The dangers of bee stings to humans"], answer: "B", explanation: "Teks report ini menjelaskan peran lebah madu dalam penyerbukan dan pentingnya hal tersebut bagi produksi pangan." },
  { id: 109, textId: "t16", type: "single", level: "C3", question: "The word 'substantially' in paragraph 3 is closest in meaning to...", options: ["slightly", "significantly", "rarely", "temporarily", "accidentally"], answer: "B", explanation: "'Decline substantially' berarti menurun secara signifikan." },
  { id: 110, textId: "t16", type: "single", level: "C4", question: "What can be inferred from the term 'colony collapse disorder' mentioned in paragraph 4?", options: ["It refers to a disease that only affects flowers","It refers to a serious decline in honey bee populations","It refers to a new method of honey production","It refers to a government policy on agriculture","It refers to a type of pesticide used by farmers"], answer: "B", explanation: "Istilah tersebut merujuk pada fenomena penurunan populasi lebah madu secara serius." },
  { id: 111, textId: "t16", type: "multi", question: "According to the text, which of the following are factors contributing to the decline of honey bee populations? (Choose TWO)", options: ["Habitat loss", "Overproduction of honey", "Pesticide use", "Excessive pollination", "Increased number of flowers"], answers: ["A","C"], explanation: "Hilangnya habitat dan penggunaan pestisida disebut sebagai dua faktor penurunan populasi lebah madu." },
  { id: 112, textId: "t16", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Pollen sticks to the fine hairs on a bee's body while it feeds.", "A single bee colony usually contains only a few dozen worker bees.", "Honey bees contribute to the pollination of fruits, vegetables, nuts, and seeds.", "Governments and organizations have launched initiatives to protect bee habitats."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — satu koloni bisa berisi ribuan lebah pekerja. (3) Benar. (4) Benar." },

  { id: 113, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'diminish'.", options: ["increase", "decrease", "remain", "expand", "multiply"], answer: "B", explanation: "'Diminish' berarti berkurang/menurun, sinonim terdekatnya adalah 'decrease'." },
  { id: 114, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'flexible'.", options: ["adaptable", "rigid", "adjustable", "versatile", "elastic"], answer: "B", explanation: "'Flexible' berarti fleksibel, sehingga lawan katanya adalah 'rigid' (kaku)." },
  { id: 115, textId: null, type: "single", level: "C3", question: "The manager decided to take on more responsibilities after the promotion. The phrasal verb 'take on' means...", options: ["to avoid", "to accept or assume", "to delegate", "to reject", "to postpone"], answer: "B", explanation: "'Take on' berarti menerima atau mengambil alih sesuatu, seperti tanggung jawab baru." },
  { id: 116, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The company invested heavily in employee training; ____, productivity increased significantly.'", options: ["consequently", "similarly", "otherwise", "in contrast", "for example"], answer: "A", explanation: "Kalimat kedua merupakan akibat logis dari kalimat pertama, sehingga konektor yang tepat adalah 'consequently'." },
  { id: 117, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The researchers collected the samples carefully so that ____ would not be contaminated.'", options: ["it", "they", "he", "this", "those"], answer: "B", explanation: "Kata ganti 'they' merujuk pada 'the samples' yang bersifat jamak." },
  { id: 118, textId: null, type: "single", level: "C4", question: "'While the new policy received criticism at first, it eventually improved overall efficiency.' What does this sentence imply?", options: ["The policy failed completely and was cancelled","Despite initial criticism, the policy turned out to be effective","The policy was never implemented","The criticism increased over time","The policy had no effect on efficiency"], answer: "B", explanation: "'While' di awal kalimat menunjukkan kontras: meskipun mendapat kritik pada awalnya, kebijakan tersebut akhirnya berhasil meningkatkan efisiensi." },
  { id: 119, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'obvious'? (Choose TWO)", options: ["evident", "hidden", "clear", "uncertain", "vague"], answers: ["A","C"], explanation: "'Obvious' berarti jelas/nyata, sinonimnya adalah 'evident' dan 'clear'." },
  { id: 120, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The team had to figure out a new solution before the deadline. [determine/solve]","She always backs up her colleagues during difficult meetings. [criticizes]","The airline decided to bring forward the departure time. [move earlier]","He set aside some money every month for emergencies. [saved separately]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'figure out' berarti menemukan/memecahkan sesuatu. (2) Tidak Sesuai — 'back up' berarti mendukung, bukan mengkritik. (3) Sesuai — 'bring forward' berarti memajukan waktu. (4) Sesuai — 'set aside' berarti menyisihkan sesuatu secara terpisah." }
);

QUESTIONS.push(
  { id: 121, textId: "t17", type: "single", level: "C2", question: "What kind of text is this?", options: ["Recount text", "Report text", "Procedure text", "Narrative text", "Descriptive text"], answer: "C", explanation: "Teks ini berisi daftar bahan dan langkah bernomor untuk membuat roti pisang, sehingga tergolong procedure text." },
  { id: 122, textId: "t17", type: "single", level: "C3", question: "According to the text, what should be done right after mashing the bananas?", options: ["Add the flour", "Mix in the melted butter", "Bake the batter", "Add the baking soda", "Preheat the oven"], answer: "B", explanation: "Setelah pisang dihaluskan, langkah berikutnya adalah mencampurkan mentega leleh." },
  { id: 123, textId: "t17", type: "single", level: "C3", question: "The word 'overmixing' in step 5 is closest in meaning to...", options: ["mixing too little", "mixing too much", "mixing too slowly", "mixing at the wrong temperature", "mixing with the wrong tool"], answer: "B", explanation: "'Overmixing' berarti mengaduk secara berlebihan, yang dapat membuat roti menjadi padat/keras." },
  { id: 124, textId: "t17", type: "multi", question: "Which of the following are mentioned as ingredients in the recipe? (Choose TWO)", options: ["Melted butter", "Milk", "Baking soda", "Vanilla extract", "Chocolate chips"], answers: ["A","C"], explanation: "Bahan yang disebutkan meliputi mentega leleh dan baking soda; susu, ekstrak vanila, dan cokelat chip tidak disebutkan." },
  { id: 125, textId: "t17", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The oven should be preheated to 175 degrees Celsius.", "The bread should be baked for 20 to 30 minutes.", "The bread should be sliced immediately after coming out of the oven.", "A toothpick can be used to check if the bread is fully baked."], answersTable: [true, false, false, true], explanation: "(1) Benar. (2) Salah — waktu memanggang adalah 50-60 menit. (3) Salah — roti perlu didinginkan minimal 10 menit sebelum diiris. (4) Benar." },

  { id: 126, textId: "t18", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The rules of a relay race", "The writer's memorable experience during their school's Sports Day", "A guide on how to organize a sports event", "A comparison between different sports competitions", "An announcement about an upcoming sports event"], answer: "B", explanation: "Teks recount ini menceritakan pengalaman pribadi penulis pada hari olahraga sekolahnya yang berkesan." },
  { id: 127, textId: "t18", type: "single", level: "C3", question: "The word 'anchor runner' in paragraph 3 most likely refers to...", options: ["the fastest runner who starts the race", "the runner who completes the final leg of a relay race", "a runner who watches from the sidelines", "the coach who trains the team", "a runner who carries the school flag"], answer: "B", explanation: "Dalam lari estafet, 'anchor runner' merujuk pada pelari yang menyelesaikan etape terakhir." },
  { id: 128, textId: "t18", type: "single", level: "C4", question: "What can be inferred about the writer's feelings during the relay race?", options: ["The writer felt completely relaxed throughout the race", "The writer experienced a mix of excitement and nervousness", "The writer regretted joining the race", "The writer was uninterested in the outcome", "The writer felt confident there would be no mistakes"], answer: "B", explanation: "Penulis merasa bersemangat sekaligus gugup saat terpilih mewakili kelasnya." },
  { id: 129, textId: "t18", type: "single", level: "C3", question: "What nearly went wrong during the relay race, according to the text?", options: ["The writer tripped and fell", "The writer nearly dropped the baton while passing it", "The team started the race too early", "The team took the wrong route", "The writer forgot to wear the team uniform"], answer: "B", explanation: "Penulis hampir menjatuhkan tongkat estafet saat memberikannya kepada rekan satu tim." },
  { id: 130, textId: "t18", type: "multi", question: "According to the text, which of the following happened on Sports Day? (Choose TWO)", options: ["The writer's class won the relay race", "The writer's class lost the tug-of-war competition", "The writer's class captain was lifted onto their shoulders", "The event was cancelled due to rain", "The writer's class finished last in the relay race"], answers: ["A","C"], explanation: "Kelas penulis memenangkan lomba estafet dan mengangkat kapten tim mereka ke atas bahu sebagai perayaan." },
  { id: 131, textId: "t18", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The writer's class won first place in the relay race.", "The writer was not chosen to participate in any race.", "The homeroom teacher took photos of the team after the race.", "The event ended with a closing ceremony."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — penulis dipilih mewakili kelasnya. (3) Benar. (4) Benar." },

  { id: 132, textId: "t19", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The different species of butterflies around the world", "The four stages of a butterfly's life cycle", "How butterflies find their mates", "The threats faced by butterflies in the wild", "The difference between butterflies and moths"], answer: "B", explanation: "Teks report ini menjelaskan empat tahap dalam siklus hidup kupu-kupu." },
  { id: 133, textId: "t19", type: "single", level: "C3", question: "The word 'emerges' in paragraph 5 is closest in meaning to...", options: ["disappears", "comes out", "hides", "sleeps", "shrinks"], answer: "B", explanation: "'Emerges from the chrysalis' berarti keluar dari kepompong." },
  { id: 134, textId: "t19", type: "single", level: "C4", question: "What can be inferred about why a caterpillar sheds its skin several times?", options: ["Its exoskeleton does not grow along with its body", "It is trying to escape from predators", "It needs to change color for camouflage", "It is preparing to lay eggs", "It is responding to changes in temperature"], answer: "A", explanation: "Ulat mengganti kulitnya berkali-kali karena eksoskeletonnya tidak ikut membesar seiring pertumbuhan tubuhnya." },
  { id: 135, textId: "t19", type: "single", level: "C3", question: "According to the text, what happens inside the chrysalis?", options: ["The caterpillar sleeps until it is ready to hatch", "The caterpillar's body breaks down and reorganizes into an adult butterfly", "The caterpillar lays eggs for the next generation", "The caterpillar grows a new set of legs only", "The caterpillar changes its diet completely"], answer: "B", explanation: "Di dalam kepompong, tubuh ulat mengalami transformasi dramatis, terurai dan tersusun kembali menjadi struktur kupu-kupu dewasa." },
  { id: 136, textId: "t19", type: "multi", question: "According to the text, which of the following are stages in a butterfly's life cycle? (Choose TWO)", options: ["Egg", "Cocoon spinning", "Larva", "Hibernation", "Migration"], answers: ["A","C"], explanation: "Empat tahap yang disebutkan adalah telur, larva, pupa, dan dewasa." },
  { id: 137, textId: "t19", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["A female butterfly usually lays her eggs on the underside of a leaf.", "The larval stage is when the caterpillar spends most of its time eating.", "An adult butterfly can fly immediately after emerging from the chrysalis.", "Complete metamorphosis consists of four stages."], answersTable: [true, true, false, true], explanation: "(1) Benar. (2) Benar. (3) Salah — kupu-kupu dewasa harus menunggu sayapnya mengering dan mengeras terlebih dahulu. (4) Benar." },

  { id: 138, textId: "t20", type: "single", level: "C2", question: "What is the purpose of this announcement?", options: ["To announce the winners of an extracurricular competition", "To inform students about extracurricular registration for the new semester", "To cancel all extracurricular activities for the semester", "To introduce new teachers at the school", "To request donations for school clubs"], answer: "B", explanation: "Pengumuman ini menginformasikan jadwal pendaftaran kegiatan ekstrakurikuler untuk semester baru." },
  { id: 139, textId: "t20", type: "single", level: "C3", question: "According to the announcement, how many extracurricular activities can a student register for per semester?", options: ["One", "Two", "Three", "Four", "Five"], answer: "B", explanation: "Siswa dapat mendaftar untuk maksimal dua kegiatan ekstrakurikuler per semester." },
  { id: 140, textId: "t20", type: "single", level: "C4", question: "What can be inferred about why the Robotics Club and Debate Club require a selection interview?", options: ["These clubs have unlimited slots for new members", "These clubs have limited slots, so selection is needed to choose members", "These clubs are being discontinued next semester", "These clubs only accept senior students", "These clubs require a written exam instead of an interview"], answer: "B", explanation: "Klub Robotik dan Klub Debat memiliki slot terbatas dan akan mengadakan wawancara seleksi singkat." },
  { id: 141, textId: "t20", type: "multi", question: "According to the announcement, which of the following are required for registration? (Choose TWO)", options: ["The registration form must be signed by the student", "Students must pay a registration fee", "The registration form must be signed by a parent or guardian", "Students must submit a portfolio", "Students must attend an orientation session"], answers: ["A","C"], explanation: "Formulir pendaftaran harus ditandatangani baik oleh siswa maupun orang tua/wali sebelum diserahkan." },
  { id: 142, textId: "t20", type: "table", question: "Based on the announcement, decide whether each statement is TRUE or FALSE.", statements: ["Registration opens on Monday, 10 August 2026.", "All extracurricular activities require a selection interview.", "Selected students for limited-slot clubs will be announced by 28 August 2026.", "Mr. Yusuf can be contacted for further information."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — hanya Klub Robotik dan Klub Debat yang memerlukan wawancara seleksi. (3) Benar. (4) Benar." },

  { id: 143, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'meticulous'.", options: ["careless", "very careful and precise", "quick", "confident", "generous"], answer: "B", explanation: "'Meticulous' berarti sangat teliti dan cermat." },
  { id: 144, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'permanent'.", options: ["lasting", "temporary", "stable", "fixed", "constant"], answer: "B", explanation: "'Permanent' berarti tetap/permanen, sehingga lawan katanya adalah 'temporary'." },
  { id: 145, textId: null, type: "single", level: "C3", question: "The volunteers worked together to clean up the beach after the storm. The phrasal verb 'clean up' means...", options: ["to make dirty", "to tidy or make clean", "to postpone", "to organize an event", "to donate money"], answer: "B", explanation: "'Clean up' berarti membersihkan atau merapikan sesuatu." },
  { id: 146, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The flight was delayed for several hours; ____, many passengers missed their connecting flights.'", options: ["as a result", "for instance", "in other words", "on the other hand", "similarly"], answer: "A", explanation: "Kalimat kedua adalah akibat dari penundaan penerbangan, sehingga konektor yang tepat adalah 'as a result'." },
  { id: 147, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The company launched a new product, and ____ quickly became popular among young consumers.'", options: ["it", "they", "he", "these", "those"], answer: "A", explanation: "Kata ganti 'it' merujuk pada 'a new product' yang bersifat tunggal dan benda." },
  { id: 148, textId: null, type: "single", level: "C4", question: "'Despite receiving limited funding, the research team managed to complete the project successfully.' What does this sentence imply?", options: ["The project failed due to lack of funding", "The team succeeded even though they had limited resources", "The team requested additional funding before starting", "The project was cancelled halfway through", "The funding was later increased significantly"], answer: "B", explanation: "'Despite' menunjukkan kontras: meskipun pendanaannya terbatas, tim peneliti tetap berhasil menyelesaikan proyek dengan sukses." },
  { id: 149, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'fragile'? (Choose TWO)", options: ["delicate", "sturdy", "breakable", "durable", "strong"], answers: ["A","C"], explanation: "'Fragile' berarti mudah pecah/rapuh, sinonimnya adalah 'delicate' dan 'breakable'." },
  { id: 150, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The teacher told the students to look over their essays before submitting them. [review]", "He decided to drop out of the competition due to an injury. [continue]", "The company plans to phase out the old model by next year. [gradually eliminate]", "She always speaks up when she disagrees with a decision. [expresses her opinion]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'look over' berarti meninjau kembali. (2) Tidak Sesuai — 'drop out' berarti mengundurkan diri, bukan melanjutkan. (3) Sesuai — 'phase out' berarti menghilangkan secara bertahap. (4) Sesuai — 'speak up' berarti menyuarakan pendapat." }
);

QUESTIONS.push(
  { id: 151, textId: "t21", type: "single", level: "C2", question: "What is the moral message of the story?", options: ["Fishermen should always ask for bigger boats", "Being satisfied with enough can be wiser than constantly wanting more without proper planning", "Magical creatures should never be trusted", "Fishing is a dangerous profession", "Wealth always leads to happiness"], answer: "B", explanation: "Keserakahan Pak Darto tanpa perencanaan yang matang justru membuatnya rugi, sehingga pesan moralnya adalah merasa cukup bisa lebih bijak daripada terus menginginkan lebih." },
  { id: 152, textId: "t21", type: "single", level: "C3", question: "The word 'sturdy' in paragraph 2 is closest in meaning to...", options: ["fragile", "strong and well-built", "colorful", "expensive", "old-fashioned"], answer: "B", explanation: "'Sturdy' berarti kuat dan kokoh." },
  { id: 153, textId: "t21", type: "single", level: "C4", question: "What can be inferred about why Pak Darto made a second wish?", options: ["He needed the boat to escape a storm", "He compared himself to wealthier fishermen and wanted more", "His first boat was damaged beyond repair", "The golden fish offered the wish without being asked", "He wanted to help other fishermen in his village"], answer: "B", explanation: "Pak Darto membandingkan dirinya dengan nelayan yang lebih kaya dan menginginkan perahu yang lebih besar lagi." },
  { id: 154, textId: "t21", type: "single", level: "C3", question: "What happened to most of the extra fish Pak Darto caught with his second boat?", options: ["He donated them to the village", "They spoiled before they could be sold", "He sold them all at a high price", "He used them to feed other fishermen", "He kept them frozen for later use"], answer: "B", explanation: "Sebagian besar ikan tambahan membusuk sebelum sempat dijual karena tidak ada perencanaan yang baik." },
  { id: 155, textId: "t21", type: "multi", question: "According to the text, which of the following are TRUE? (Choose TWO)", options: ["The golden fish granted Pak Darto two wishes in total", "Pak Darto's village had unlimited demand for fish", "The golden fish warned that the second wish would be its last favor", "Pak Darto eventually returned to his simpler way of fishing", "Pak Darto sold his boat after the second wish"], answers: ["C","D"], explanation: "Ikan emas memperingatkan bahwa permintaan kedua adalah bantuan terakhirnya, dan Pak Darto akhirnya kembali ke cara menangkap ikan yang lebih sederhana." },
