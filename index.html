  { id: 350, textId: "t48", type: "single", level: "C4", question: "What can be inferred from the statement that bilingual students 'approach problems from multiple perspectives'?", options: ["Bilingual students always perform worse in problem-solving tasks", "Navigating two languages may contribute to more flexible thinking", "Monolingual students cannot solve problems at all", "Multiple perspectives always lead to slower decision-making", "Bilingual education eliminates the need for problem-solving skills"], answer: "B", explanation: "Menavigasi dua sistem bahasa dapat berkontribusi pada pemikiran yang lebih fleksibel." },
  { id: 351, textId: "t48", type: "multi", question: "According to the text, which of the following are benefits of bilingual education mentioned by the writer? (Choose TWO)", options: ["Enhanced cognitive flexibility", "Guaranteed higher salaries in adulthood", "Support for cultural awareness and identity development", "Elimination of the need for standardized testing", "Automatic fluency in a third language"], answers: ["A","C"], explanation: "Manfaat yang disebutkan meliputi peningkatan fleksibilitas kognitif dan dukungan kesadaran budaya serta identitas." },
  { id: 352, textId: "t48", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Bilingual education requires qualified bilingual teachers to be successful.", "All bilingual education programs automatically succeed regardless of resources.", "Bilingual students may develop stronger executive function skills.", "Bilingual education can help students maintain connections to their cultural background."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — program tanpa sumber daya memadai dapat gagal. (3) Benar. (4) Benar." },

  { id: 353, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'persistent'.", options: ["hesitant", "continuing firmly despite difficulty", "careless", "temporary", "forgetful"], answer: "B", explanation: "'Persistent' berarti gigih/terus berusaha meskipun menghadapi kesulitan." },
  { id: 354, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'humble'.", options: ["modest", "arrogant", "polite", "shy", "kind"], answer: "B", explanation: "'Humble' berarti rendah hati, sehingga lawan katanya adalah 'arrogant'." },
  { id: 355, textId: null, type: "single", level: "C3", question: "The government decided to roll back the new tax policy after public protests. The phrasal verb 'roll back' means...", options: ["to expand", "to reverse or cancel a previous decision", "to publicize", "to approve", "to enforce strictly"], answer: "B", explanation: "'Roll back' berarti membatalkan atau membalikkan keputusan sebelumnya." },
  { id: 356, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The team lacked sufficient preparation time; ____, their performance suffered during the competition.'", options: ["as a result", "in addition", "for instance", "on the other hand", "similarly"], answer: "A", explanation: "Kalimat kedua adalah akibat logis dari kalimat pertama." },
  { id: 357, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The researchers published their study, and ____ conclusions were later confirmed by other scientists.'", options: ["its", "their", "his", "her", "this"], answer: "B", explanation: "Kata ganti kepemilikan 'their' merujuk pada 'the researchers' yang bersifat jamak." },
  { id: 358, textId: null, type: "single", level: "C4", question: "'Despite limited experience, the young chef managed to impress the judges with her dish.' What does this sentence imply?", options: ["The judges were unimpressed due to her lack of experience", "She succeeded in impressing the judges despite her limited experience", "The competition was cancelled before the judging round", "She refused to participate in the competition", "Her limited experience prevented her from finishing the dish"], answer: "B", explanation: "'Despite' menunjukkan kontras: meskipun pengalamannya terbatas, koki muda tersebut tetap berhasil mengesankan para juri." },
  { id: 359, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'ample'? (Choose TWO)", options: ["sufficient", "scarce", "plentiful", "limited", "insufficient"], answers: ["A","C"], explanation: "'Ample' berarti cukup/berlimpah, sinonimnya adalah 'sufficient' dan 'plentiful'." },
  { id: 360, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The company decided to branch out into a new market segment. [expand into]", "He tends to brush off criticism instead of considering it seriously. [takes very seriously]", "The engineers had to work around the design limitations. [find a solution despite]", "She always follows through on her promises. [completes as promised]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'branch out into' berarti memperluas ke segmen baru. (2) Tidak Sesuai — 'brush off' berarti mengabaikan, bukan menanggapi serius. (3) Sesuai — 'work around' berarti menemukan solusi meskipun ada keterbatasan. (4) Sesuai — 'follow through on' berarti menepati janji." }
);

QUESTIONS.push(
  { id: 361, textId: "t49", type: "single", level: "C2", question: "What is the text mainly about?", options: ["A guide on how to build a competition robot", "The writer's experience competing in a regional robotics competition", "The history of robotics competitions in Indonesia", "An announcement about an upcoming robotics event", "A comparison between different robotics teams"], answer: "B", explanation: "Teks recount ini menceritakan pengalaman penulis mengikuti kompetisi robotik regional bersama timnya." },
  { id: 362, textId: "t49", type: "single", level: "C3", question: "The word 'flawlessly' in paragraph 3 is closest in meaning to...", options: ["poorly", "without any mistakes", "slowly", "unpredictably", "loudly"], answer: "B", explanation: "'Flawlessly' berarti tanpa cacat/kesalahan." },
  { id: 363, textId: "t49", type: "single", level: "C4", question: "What can be inferred about Rani's character from her actions during the semifinal round?", options: ["She panicked and gave up when the wheel came loose", "She reacted quickly and calmly to solve an unexpected problem", "She blamed her teammates for the malfunction", "She refused to touch the robot during the match", "She was unaware that anything had gone wrong"], answer: "B", explanation: "Rani dengan cepat mengambil obeng dan memperbaiki roda yang lepas dalam hitungan detik." },
  { id: 364, textId: "t49", type: "single", level: "C3", question: "According to the text, what problem occurred with the robot's sensor before the competition?", options: ["It stopped working completely", "It kept misreading certain shades of blue", "It was too slow to sort the blocks", "It could not connect to the remote control", "It overheated during testing"], answer: "B", explanation: "Sensor robot terus salah membaca warna biru tertentu sebelum kompetisi." },
  { id: 365, textId: "t49", type: "multi", question: "According to the text, which of the following are TRUE? (Choose TWO)", options: ["The team placed first overall in the competition", "The team advanced to the semifinal round", "The robot's wheel came loose during the semifinal match", "The team gave up after the sensor problem", "The competition was held at the team's own school"], answers: ["B","C"], explanation: "Tim penulis melaju ke babak semifinal, dan roda robot mereka lepas selama pertandingan semifinal." },
  { id: 366, textId: "t49", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The team consisted of five members.", "The team placed first in the competition.", "Rani fixed the robot's wheel during the semifinal match.", "Pak Hendra was disappointed with the team's performance."], answersTable: [true, false, true, false], explanation: "(1) Benar. (2) Salah — tim menempati posisi keempat. (3) Benar. (4) Salah — Pak Hendra justru terkesan." },

  { id: 367, textId: "t50", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The history of electricity generation", "How wind power works and its advantages and limitations", "A comparison between wind power and nuclear power", "The construction process of wind turbines", "Government subsidies for renewable energy"], answer: "B", explanation: "Teks report ini menjelaskan cara kerja tenaga angin serta kelebihan dan keterbatasannya." },
  { id: 368, textId: "t50", type: "single", level: "C3", question: "The word 'inexhaustible' in paragraph 3 is closest in meaning to...", options: ["limited", "never running out", "expensive", "dangerous", "artificial"], answer: "B", explanation: "'Inexhaustible' berarti tidak akan pernah habis." },
  { id: 369, textId: "t50", type: "single", level: "C4", question: "What can be inferred from the statement that 'electricity generation may fluctuate depending on weather conditions'?", options: ["Wind power always produces a constant, unchanging amount of electricity", "Wind power output can be inconsistent due to changing wind patterns", "Weather has no effect on wind turbine performance", "Wind turbines only operate during storms", "Wind power is more reliable than any other energy source"], answer: "B", explanation: "Keluaran listrik tenaga angin bisa tidak konsisten karena bergantung pada pola angin yang berubah-ubah." },
  { id: 370, textId: "t50", type: "single", level: "C3", question: "According to the text, what concern have some communities raised about wind turbines?", options: ["Their high cost of electricity production", "Their visual impact on landscapes and effect on local bird populations", "Their tendency to cause power outages", "Their requirement for constant human supervision", "Their inability to operate in coastal areas"], answer: "B", explanation: "Kekhawatiran masyarakat terkait dampak visual turbin terhadap lanskap dan potensi dampaknya pada populasi burung." },
  { id: 371, textId: "t50", type: "multi", question: "According to the text, which of the following are advantages of wind power mentioned by the writer? (Choose TWO)", options: ["It produces no direct greenhouse gas emissions during operation", "It requires no upfront investment", "The energy source itself is free and inexhaustible", "It can generate a completely constant electricity output", "It eliminates the need for electrical grids"], answers: ["A","C"], explanation: "Keunggulan yang disebutkan meliputi tidak adanya emisi gas rumah kaca langsung dan sumber energi yang gratis serta tidak akan habis." },
  { id: 372, textId: "t50", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Wind turbines convert kinetic energy from moving air into electricity.", "Wind farms are typically located in areas with weak, inconsistent wind.", "Wind power produces no direct greenhouse gas emissions during operation.", "Many countries continue to invest in wind power as part of their energy strategy."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — ladang angin ditempatkan di area dengan pola angin kuat dan konsisten. (3) Benar. (4) Benar." },

  { id: 373, textId: "t51", type: "single", level: "C2", question: "What kind of text is this?", options: ["Recount text", "Report text", "Procedure text", "Narrative text", "Analytical exposition"], answer: "C", explanation: "Teks ini berisi daftar bahan dan langkah bernomor untuk menyiapkan kit darurat, tergolong procedure text." },
  { id: 374, textId: "t51", type: "single", level: "C3", question: "According to the text, how much water and food should be packed for each family member?", options: ["Enough to last one day", "Enough to last at least three days", "Enough to last exactly one week", "Enough to last one month", "Only enough for emergencies lasting a few hours"], answer: "B", explanation: "Air dan makanan yang dikemas harus cukup untuk setiap anggota keluarga selama minimal tiga hari." },
  { id: 375, textId: "t51", type: "single", level: "C3", question: "Why should important documents be placed in a waterproof plastic bag, according to the text?", options: ["To make them easier to carry", "To protect them from water damage inside the kit", "To keep them organized by date", "To prevent them from being lost", "To make copies easier to identify"], answer: "B", explanation: "Dokumen penting dimasukkan ke dalam kantong plastik tahan air untuk melindunginya dari kerusakan akibat air." },
  { id: 376, textId: "t51", type: "multi", question: "Which of the following items are mentioned as part of the emergency kit? (Choose TWO)", options: ["A flashlight and extra batteries", "A laptop computer", "A basic first aid kit", "A set of kitchen knives", "A television"], answers: ["A","C"], explanation: "Barang yang disebutkan meliputi senter dengan baterai cadangan dan kotak P3K dasar." },
  { id: 377, textId: "t51", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The kit should be checked every six months.", "The emergency kit should be stored in a hard-to-reach location.", "A portable phone charger is recommended as part of the kit.", "The flashlight should be tested before being packed."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — kit sebaiknya disimpan di lokasi yang mudah diakses. (3) Benar. (4) Benar." },

  { id: 378, textId: "t52", type: "single", level: "C2", question: "What is the purpose of this announcement?", options: ["To announce the cancellation of all school bus services", "To inform students and parents about changes to school bus routes", "To announce new bus drivers", "To request payment for bus fees", "To announce a new school holiday schedule"], answer: "B", explanation: "Pengumuman ini menginformasikan perubahan rute bus sekolah." },
  { id: 379, textId: "t52", type: "single", level: "C3", question: "According to the announcement, why are the bus routes being adjusted?", options: ["Due to a shortage of bus drivers", "Due to ongoing road construction along Jalan Merdeka", "Due to a change in school operating hours", "Due to a request from parents", "Due to a new traffic law"], answer: "B", explanation: "Rute bus disesuaikan karena konstruksi jalan yang sedang berlangsung di Jalan Merdeka." },
  { id: 380, textId: "t52", type: "single", level: "C4", question: "What can be inferred about why parents of Route C students are asked to accompany their children during the first week?", options: ["The new pick-up point may be unfamiliar and requires an adjustment period", "Route C has been permanently cancelled", "Parents are required to drive their children to school entirely", "The bus company refuses to operate without parental supervision", "Route C students must pay an additional fee"], answer: "A", explanation: "Titik jemput baru mungkin belum familiar bagi siswa, sehingga memerlukan masa penyesuaian." },
  { id: 381, textId: "t52", type: "multi", question: "According to the announcement, which of the following routes are affected by the changes? (Choose TWO)", options: ["Route A", "Route B", "Route C", "Route D", "Route F"], answers: ["A","C"], explanation: "Rute A dan Rute C disebutkan mengalami perubahan; Rute B dan D tidak terpengaruh." },
  { id: 382, textId: "t52", type: "table", question: "Based on the announcement, decide whether each statement is TRUE or FALSE.", statements: ["The route changes begin on Monday, 7 September 2026.", "Route E's pick-up time will be adjusted 10 minutes later.", "Route B remains unaffected by the changes.", "Updated route maps were sent via the school's parent communication app."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — waktu jemput Rute E dimajukan 10 menit lebih awal. (3) Benar. (4) Benar." },

  { id: 383, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'resilient'.", options: ["fragile", "able to recover quickly from difficulties", "careless", "temporary", "confused"], answer: "B", explanation: "'Resilient' berarti tangguh/mampu pulih dengan cepat dari kesulitan." },
  { id: 384, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'expand'.", options: ["grow", "shrink", "increase", "extend", "widen"], answer: "B", explanation: "'Expand' berarti memperluas, sehingga lawan katanya adalah 'shrink'." },
  { id: 385, textId: null, type: "single", level: "C3", question: "The team decided to iron out any remaining disagreements before the final presentation. The phrasal verb 'iron out' means...", options: ["to create new problems", "to resolve difficulties or disagreements", "to postpone a discussion", "to ignore an issue completely", "to complicate a situation"], answer: "B", explanation: "'Iron out' berarti menyelesaikan kesulitan atau perselisihan." },
  { id: 386, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The airline canceled several flights due to the storm; ____, thousands of passengers were stranded at the airport.'", options: ["as a result", "similarly", "for example", "in the meantime", "on the other hand"], answer: "A", explanation: "Kalimat kedua adalah akibat logis dari kalimat pertama." },
  { id: 387, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The committee reviewed the proposal carefully before approving ____ for the next stage.'", options: ["it", "they", "them", "these", "him"], answer: "A", explanation: "Kata ganti 'it' merujuk pada 'the proposal' yang bersifat tunggal dan benda." },
  { id: 388, textId: null, type: "single", level: "C4", question: "'Although the venue was smaller than expected, the event organizers managed to accommodate all the guests comfortably.' What does this sentence imply?", options: ["The smaller venue caused major problems for the guests", "The organizers succeeded in managing the smaller space effectively", "The event was cancelled due to space limitations", "Some guests were turned away from the event", "The venue was later changed to a larger one"], answer: "B", explanation: "'Although' menunjukkan kontras: meskipun tempatnya lebih kecil, panitia tetap berhasil menampung semua tamu dengan nyaman." },
  { id: 389, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'vital'? (Choose TWO)", options: ["essential", "trivial", "crucial", "minor", "optional"], answers: ["A","C"], explanation: "'Vital' berarti sangat penting, sinonimnya adalah 'essential' dan 'crucial'." },
  { id: 390, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The manager asked the team to draw up a detailed proposal by Friday. [prepare/create]", "She tends to hold back her true opinions during meetings. [expresses freely]", "The company had to scale up production to meet rising demand. [increase]", "He always backs down when faced with a difficult argument. [gives up his position]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'draw up' berarti menyiapkan/membuat sesuatu. (2) Tidak Sesuai — 'hold back' berarti menahan diri, bukan mengungkapkan bebas. (3) Sesuai — 'scale up' berarti meningkatkan. (4) Sesuai — 'back down' berarti mengalah dari posisinya." }
);

QUESTIONS.push(
  { id: 391, textId: "t53", type: "single", level: "C2", question: "What is the moral message of the story?", options: ["Secret recipes should never be shared under any circumstances", "Sharing valuable knowledge can sometimes benefit everyone more than keeping it hidden", "Competition always destroys small businesses", "Floods are the biggest threat to local businesses", "Family recipes should only be passed down within the family"], answer: "B", explanation: "Cerita ini menunjukkan bahwa berbagi resep rahasia Bu Wati justru membuat ketiga toko roti berkembang bersama." },
  { id: 392, textId: "t53", type: "single", level: "C3", question: "The word 'replicate' in paragraph 1 is closest in meaning to...", options: ["invent", "copy or reproduce exactly", "sell", "advertise", "destroy"], answer: "B", explanation: "'Replicate' berarti meniru atau membuat ulang sesuatu secara persis." },
  { id: 393, textId: "t53", type: "single", level: "C4", question: "What can be inferred about why Bu Wati decided to teach the recipe to her former competitors?", options: ["She wanted to close her own bakery permanently", "She was moved by their financial struggles after the flood", "She was forced to do so by the local government", "She wanted to reduce her own workload", "She no longer enjoyed baking"], answer: "B", explanation: "Bu Wati tergerak setelah melihat berita tentang keluarga yang masih kesulitan secara finansial pascabanjir." },
  { id: 394, textId: "t53", type: "single", level: "C3", question: "According to the text, what happened to the town's other bakeries during the flood?", options: ["They were relocated to a different town", "Two of them were destroyed", "They merged with Bu Wati's bakery", "They were converted into restaurants", "They remained completely unaffected"], answer: "B", explanation: "Banjir menghancurkan beberapa usaha kecil, termasuk dua toko roti lainnya." },
  { id: 395, textId: "t53", type: "multi", question: "According to the text, which of the following are TRUE? (Choose TWO)", options: ["Bu Wati inherited the recipe from her mother", "All three bakeries eventually struggled financially", "Bu Wati taught the recipe to two former competitors", "The flood only affected Bu Wati's bakery", "Bu Wati regretted sharing the recipe"], answers: ["A","C"], explanation: "Bu Wati mewarisi resep dari ibunya, dan ia mengajarkan resep tersebut kepada dua mantan pesaingnya." },
  { id: 396, textId: "t53", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Bu Wati's bakery was the only one still standing after the flood.", "Bu Wati refused to share her recipe even after the flood.", "All three bakeries eventually thrived after the recipe was shared.", "Some customers initially worried that Bu Wati had made a mistake."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — ia justru mengajarkan resepnya. (3) Benar. (4) Benar." },

  { id: 397, textId: "t54", type: "single", level: "C2", question: "What is the writer's main argument in this text?", options: ["Employees should always prioritize work over personal life", "Maintaining a healthy work-life balance is essential for career success and well-being", "Companies should eliminate all working hour regulations", "Burnout only affects employees in certain industries", "Personal relationships have no effect on job performance"], answer: "B", explanation: "Teks ini berargumen bahwa keseimbangan kerja-kehidupan yang sehat penting bagi kesuksesan karier dan kesejahteraan." },
  { id: 398, textId: "t54", type: "single", level: "C3", question: "The word 'burnout' in paragraph 3 is closest in meaning to...", options: ["a state of high motivation and energy", "a state of emotional and physical exhaustion caused by prolonged stress", "a type of workplace celebration", "a formal job promotion", "a period of paid vacation"], answer: "B", explanation: "'Burnout' merujuk pada kondisi kelelahan emosional dan fisik akibat stres berkepanjangan." },
  { id: 399, textId: "t54", type: "single", level: "C4", question: "What can be inferred from the statement that employees working excessive hours 'tend to experience declining concentration and increased errors'?", options: ["Working longer hours always improves overall productivity", "Excessive working hours may actually reduce the quality of work over time", "Concentration is unrelated to the number of hours worked", "Errors only occur due to lack of training", "Longer working hours guarantee better job performance"], answer: "B", explanation: "Bekerja berlebihan dapat menurunkan kualitas kerja seiring waktu." },
  { id: 400, textId: "t54", type: "single", level: "C3", question: "According to paragraph 4, what does spending time with family and friends contribute to?", options: ["A person's overall sense of fulfillment", "A guaranteed increase in salary", "A reduction in working hours automatically", "A decrease in job responsibilities", "An automatic promotion at work"], answer: "A", explanation: "Waktu bersama keluarga, teman, dan hobi pribadi berkontribusi pada rasa kepuasan hidup seseorang." },
  { id: 401, textId: "t54", type: "multi", question: "According to the text, which of the following are consequences of burnout mentioned by the writer? (Choose TWO)", options: ["Reduced motivation", "Guaranteed promotion", "Increased absenteeism", "Improved concentration", "Higher salary"], answers: ["A","C"], explanation: "Konsekuensi burnout yang disebutkan meliputi berkurangnya motivasi dan meningkatnya ketidakhadiran kerja." },
  { id: 402, textId: "t54", type: "table", question: "Based on the text, decide whether each statement is APPROPRIATE (Tepat) or NOT APPROPRIATE (Tidak Tepat).", statements: ["The writer believes work-life balance is optional for career success.", "Excessive working hours can lead to declining job performance over time.", "Burnout can result in reduced motivation and increased absenteeism.", "The writer believes only employees are responsible for maintaining work-life balance."], answersTable: [false, true, true, false], explanation: "(1) Tidak Tepat — penulis menganggapnya esensial. (2) Tepat. (3) Tepat. (4) Tidak Tepat — tanggung jawab bersama antara perusahaan dan karyawan." },

  { id: 403, textId: "t55", type: "single", level: "C2", question: "What is the purpose of this email?", options: ["To request a donation for a community program", "To express interest in volunteering as a tutor for a weekend program", "To apply for a paid teaching position", "To request academic advice from a professor", "To report a problem with an existing volunteer program"], answer: "B", explanation: "Email ini ditulis untuk menyatakan minat Bimo bergabung sebagai relawan pengajar." },
  { id: 404, textId: "t55", type: "single", level: "C3", question: "According to the email, how did Bimo first learn about the program?", options: ["Through a social media advertisement", "Through a friend who had volunteered with the organization", "Through his university's career center", "Through a newspaper article", "Through a school announcement"], answer: "B", explanation: "Bimo mengetahui program tersebut melalui seorang teman yang sudah menjadi relawan." },
  { id: 405, textId: "t55", type: "single", level: "C4", question: "What can be inferred about Bimo's suitability for the tutoring role based on his past experience?", options: ["He has no relevant experience at all", "His informal tutoring experience may help him explain concepts clearly to struggling students", "He has only taught university-level mathematics", "He has never worked with children before", "He was a professional teacher before university"], answer: "B", explanation: "Pengalaman informalnya membantu siswa SMA dengan matematika memberinya pemahaman tentang cara menjelaskan konsep dengan jelas." },
  { id: 406, textId: "t55", type: "multi", question: "According to the email, which of the following did Bimo mention? (Choose TWO)", options: ["His availability on Saturday afternoons", "His current salary expectations", "His willingness to commit for at least one semester", "His preference to work only with adult learners", "His plan to eventually lead the organization"], answers: ["A","C"], explanation: "Bimo menyebutkan ketersediaannya pada Sabtu sore dan kesediaannya berkomitmen minimal satu semester." },
  { id: 407, textId: "t55", type: "table", question: "Based on the email, decide whether each statement is TRUE or FALSE.", statements: ["Bimo is majoring in Mathematics Education.", "Bimo has previous experience tutoring younger students informally.", "Bimo demanded to start volunteering immediately without any process.", "Bimo expressed admiration for the organization's work."], answersTable: [true, true, false, true], explanation: "(1) Benar. (2) Benar. (3) Salah — ia menanyakan proses aplikasi, bukan menuntut langsung mulai. (4) Benar." },

  { id: 408, textId: "t56", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The history of ocean exploration", "The types, causes, and global importance of ocean currents", "The formation of tsunamis", "The migration patterns of specific fish species", "The economics of the global shipping industry"], answer: "B", explanation: "Teks report ini menjelaskan jenis, penyebab, dan pentingnya arus laut secara global." },
  { id: 409, textId: "t56", type: "single", level: "C3", question: "The word 'salinity' in paragraph 2 is closest in meaning to...", options: ["temperature level", "the amount of salt content in water", "water pressure", "wave height", "water clarity"], answer: "B", explanation: "'Salinity' merujuk pada kadar garam dalam air." },
  { id: 410, textId: "t56", type: "single", level: "C4", question: "What can be inferred about why Western Europe has a relatively mild climate despite its northern latitude?", options: ["It is influenced by the warm waters carried by the Gulf Stream", "It receives no ocean currents at all", "It is located near the equator", "Its climate is unrelated to ocean currents", "It has an unusually low elevation"], answer: "A", explanation: "Gulf Stream membawa air hangat yang memengaruhi iklim relatif sejuk di sebagian Eropa Barat." },
  { id: 411, textId: "t56", type: "multi", question: "According to the text, which of the following are factors that drive ocean currents? (Choose TWO)", options: ["Wind patterns", "Volcanic activity", "Differences in water temperature and salinity", "Human shipping traffic", "Coral reef formations"], answers: ["A","C"], explanation: "Arus laut digerakkan terutama oleh angin serta perbedaan suhu dan salinitas air." },
  { id: 412, textId: "t56", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Surface currents are mainly driven by wind patterns.", "Deep-water currents are primarily driven by wind alone.", "The Gulf Stream flows from the Gulf of Mexico toward Western Europe.", "Scientists have expressed concern about climate change affecting ocean current patterns."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — arus dalam laut digerakkan oleh perbedaan densitas air. (3) Benar. (4) Benar." },

  { id: 413, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'meticulously'.", options: ["carelessly", "with great attention to detail", "quickly", "occasionally", "loudly"], answer: "B", explanation: "'Meticulously' berarti dengan sangat cermat dan penuh perhatian pada detail." },
  { id: 414, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'flourish'.", options: ["thrive", "decline", "prosper", "grow", "succeed"], answer: "B", explanation: "'Flourish' berarti berkembang pesat, sehingga lawan katanya adalah 'decline'." },
  { id: 415, textId: null, type: "single", level: "C3", question: "The organization decided to team up with several local schools for the literacy campaign. The phrasal verb 'team up with' means...", options: ["to compete against", "to collaborate with", "to avoid", "to criticize", "to replace"], answer: "B", explanation: "'Team up with' berarti bekerja sama dengan pihak lain." },
  { id: 416, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The new medication showed promising results in early trials; ____, researchers decided to expand the study.'", options: ["as a result", "however", "in contrast", "for instance", "meanwhile"], answer: "A", explanation: "Kalimat kedua adalah akibat logis dari kalimat pertama." },
  { id: 417, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The volunteers repaired the old playground, and ____ hard work was appreciated by the entire neighborhood.'", options: ["its", "their", "his", "her", "this"], answer: "B", explanation: "Kata ganti kepemilikan 'their' merujuk pada 'the volunteers' yang bersifat jamak." },
  { id: 418, textId: null, type: "single", level: "C4", question: "'Despite the tight budget, the team produced a documentary that received widespread praise.' What does this sentence imply?", options: ["The documentary failed due to budget constraints", "The team succeeded despite having limited financial resources", "The team refused to work with a limited budget", "The documentary was never completed", "The budget was later increased significantly"], answer: "B", explanation: "'Despite' menunjukkan kontras: meskipun anggarannya terbatas, tim tetap berhasil menghasilkan dokumenter yang mendapat pujian luas." },
  { id: 419, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'meticulous'? (Choose TWO)", options: ["thorough", "careless", "precise", "sloppy", "hasty"], answers: ["A","C"], explanation: "'Meticulous' berarti sangat teliti, sinonimnya adalah 'thorough' dan 'precise'." },
  { id: 420, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The company decided to roll out the new policy gradually across all branches. [implement]", "He always owns up to his mistakes instead of blaming others. [denies]", "The team had to piece together the evidence to solve the case. [assemble/combine]", "She managed to talk her way out of the misunderstanding. [avoid trouble through persuasive talking]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'roll out' berarti menerapkan secara bertahap. (2) Tidak Sesuai — 'own up to' berarti mengakui, bukan menyangkal. (3) Sesuai — 'piece together' berarti menyusun/menggabungkan. (4) Sesuai — 'talk one's way out of' berarti menghindari masalah lewat kata-kata persuasif." }

  { id: 429, textId: "t58", type: "single", level: "C4", question: "What can be inferred from the statement that playing an instrument requires 'coordinating multiple mental processes simultaneously'?", options: ["Playing an instrument only involves physical movement", "This combination of tasks may help strengthen cognitive skills over time", "Musical notation is unrelated to cognitive development", "Only professional musicians benefit cognitively from playing", "Playing an instrument requires no mental effort at all"], answer: "B", explanation: "Kombinasi tugas mental saat bermain musik dapat memperkuat kemampuan kognitif seiring waktu." },
  { id: 430, textId: "t58", type: "single", level: "C3", question: "According to paragraph 4, what skill is developed through playing in an ensemble or band?", options: ["Individual competitiveness", "Teamwork skills through cooperation and active listening", "Solo performance techniques only", "Music composition skills exclusively", "Financial management skills"], answer: "B", explanation: "Bermain bersama musisi lain memerlukan kerja sama dan mendengarkan aktif, yang mengembangkan keterampilan kerja tim." },
  { id: 431, textId: "t58", type: "multi", question: "According to the text, which of the following are benefits of learning an instrument mentioned by the writer? (Choose TWO)", options: ["Improved memory and attention span", "Guaranteed career success as a musician", "Reduced stress and improved emotional well-being", "Elimination of the need for formal education", "Automatic mastery of multiple instruments"], answers: ["A","C"], explanation: "Manfaat yang disebutkan meliputi peningkatan daya ingat dan pengurangan stres." },

  { id: 434, textId: "t59", type: "single", level: "C3", question: "According to the text, what should be done after calculating total income and expenses?", options: ["Immediately spend any remaining money", "Set aside a portion of remaining money for savings", "Cancel all fixed monthly expenses", "Ignore the results and repeat the calculation", "Increase spending on entertainment"], answer: "B", explanation: "Setelah menghitung sisa uang, sebagian sebaiknya disisihkan untuk tabungan." },

  { id: 442, textId: "t60", type: "table", question: "Based on the announcement, decide whether each statement is TRUE or FALSE.", statements: ["The recycling program begins on Monday, 14 September 2026.", "The briefing session will be held in the school library.", "Students who sort waste correctly may be recognized during the monthly assembly.", "This program is organized by the Environmental Club."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — sesi pengarahan diadakan di aula sekolah. (3) Benar. (4) Benar." },

  { id: 443, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'innovative'.", options: ["outdated", "creatively new and original", "expensive", "traditional", "complicated"], answer: "B", explanation: "'Innovative' berarti baru dan orisinal secara kreatif." },
  { id: 444, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'confirm'.", options: ["verify", "deny", "support", "prove", "validate"], answer: "B", explanation: "'Confirm' berarti mengonfirmasi, sehingga lawan katanya adalah 'deny'." },
  { id: 445, textId: null, type: "single", level: "C3", question: "The organization decided to reach out to local businesses for sponsorship. The phrasal verb 'reach out to' means...", options: ["to ignore", "to contact or approach someone", "to reject", "to compete with", "to criticize"], answer: "B", explanation: "'Reach out to' berarti menghubungi atau mendekati seseorang atau pihak lain." },

  { id: 447, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The engineers designed a new bridge, and ____ construction is expected to finish next year.'", options: ["its", "their", "his", "her", "this"], answer: "A", explanation: "Kata ganti kepemilikan 'its' merujuk pada 'a new bridge' yang bersifat tunggal dan benda." },
  { id: 448, textId: null, type: "single", level: "C4", question: "'Even though she had never performed in public before, the young singer delivered a confident performance.' What does this sentence imply?", options: ["She refused to perform due to lack of experience", "She performed confidently despite her lack of prior public experience", "The performance was cancelled at the last minute", "She was replaced by a more experienced singer", "The audience left before she finished singing"], answer: "B", explanation: "'Even though' menunjukkan kontras: meskipun belum pernah tampil di depan umum, penyanyi muda tersebut tetap tampil dengan percaya diri." },
  { id: 449, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'innovative'? (Choose TWO)", options: ["creative", "conventional", "original", "outdated", "traditional"], answers: ["A","C"], explanation: "'Innovative' berarti kreatif dan orisinal, sinonimnya adalah 'creative' dan 'original'." },
  { id: 450, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The startup managed to break into a highly competitive market. [successfully enter]", "She always dwells on her past failures instead of moving forward. [forgets quickly]", "The company had to phase out its older product lines gradually. [gradually eliminate]", "He worked hard to build up his savings over several years. [gradually increase]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'break into' berarti berhasil memasuki sesuatu. (2) Tidak Sesuai — 'dwell on' berarti terus memikirkan, bukan melupakan. (3) Sesuai — 'phase out' berarti menghilangkan bertahap. (4) Sesuai — 'build up' berarti meningkatkan bertahap." }

<script>
(function () {
  const app = document.getElementById('app');

  const state = {
    screen: 'login',       // login | packages | confirm | exam | result | review
    student: { name: '', school: '' },
    activePackage: null,
    answers: {},            // qId -> answer value
    flagged: new Set(),     // qId marked ragu-ragu
    currentIndex: 0,
    timeLeft: 0,
    timerHandle: null,
    lastResult: null,
    fontScale: 1
  };

  // ---------- Storage helpers ----------
  const LS_KEY = 'tka_bing_progress_v1';
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveProgress(data) {
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  }
  function getPackageStatus(pkgId) {
    const p = loadProgress();
    return p[pkgId] || { status: 'belum', score: null, answers: {} };
  }
  function setPackageStatus(pkgId, obj) {
    const p = loadProgress();
    p[pkgId] = Object.assign({}, p[pkgId], obj);
    saveProgress(p);
  }

  function getQuestionsForPackage(pkg) {
    return QUESTIONS.filter(q => q.id >= pkg.range[0] && q.id <= pkg.range[1]);
  }

  // ---------- Rendering ----------
  function render() {
    if (state.screen === 'login') return renderLogin();
    if (state.screen === 'packages') return renderPackages();
    if (state.screen === 'confirm') return renderConfirm();
    if (state.screen === 'exam') return renderExam();
    if (state.screen === 'result') return renderResult();
    if (state.screen === 'review') return renderReview();
  }

  function renderLogin() {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 to-slate-200">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8 fade-in">
          <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-900 text-white font-bold text-xl mb-3">TKA</div>
            <h1 class="text-xl font-bold text-slate-800">Simulasi Try Out TKA</h1>
            <p class="text-sm text-slate-500 mt-1">Bahasa Inggris (Wajib) — SMA/MA/SMK Sederajat</p>
          </div>
          <form id="loginForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
              <input required id="inputName" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" placeholder="Contoh: Siti Aminah" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Asal Sekolah</label>
              <input required id="inputSchool" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" placeholder="Contoh: SMA Harapan Bangsa" />
            </div>
            <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition">Masuk</button>
          </form>
          <p class="text-xs text-slate-400 text-center mt-5">Data disimpan di perangkat Anda sendiri (localStorage).</p>
        </div>
      </div>
    `;
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      state.student.name = document.getElementById('inputName').value.trim();
      state.student.school = document.getElementById('inputSchool').value.trim();
      if (!state.student.name || !state.student.school) return;
      state.screen = 'packages';
      render();
    });
  }

  function statusBadge(status) {
    if (status.status === 'selesai') return `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-green-100 text-green-700">Selesai · Skor ${status.score}</span>`;
    if (status.status === 'sedang') return `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-yellow-100 text-yellow-700">Sedang Dikerjakan</span>`;
    return `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-600">Belum Dikerjakan</span>`;
  }

  function renderPackages() {
    const rows = PACKAGES.map(pkg => {
      const st = getPackageStatus(pkg.id);
      const nSoal = pkg.range[1] - pkg.range[0] + 1;
      return `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">

            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-semibold text-slate-800">${pkg.name}</h3>

            <p class="text-sm text-slate-500">${pkg.description}</p>
            <p class="text-xs text-slate-400 mt-1">${nSoal} soal · ${pkg.durationMinutes} menit</p>
          </div>
          <div class="flex gap-2 shrink-0">
            <button data-pkg="${pkg.id}" class="btnLeaderboard px-3 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">Peringkat</button>
            <button data-pkg="${pkg.id}" class="btnStart px-4 py-2 text-sm rounded-lg bg-blue-900 hover:bg-blue-800 text-white font-medium">${st.status === 'selesai' ? 'Kerjakan Lagi' : (st.status === 'sedang' ? 'Lanjutkan' : 'Mulai')}</button>
          </div>
        </div>`;
    }).join('');

    app.innerHTML = `
      <div class="min-h-screen bg-slate-100">
        <div class="bg-blue-950 text-white px-4 py-4">
          <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div>
              <p class="font-semibold">${state.student.name}</p>
              <p class="text-xs text-blue-200">${state.student.school}</p>
            </div>
            <button id="btnLogout" class="text-xs px-3 py-1.5 rounded-lg border border-blue-300 hover:bg-blue-900">Keluar</button>

        </div>
        <div class="max-w-3xl mx-auto p-4 sm:p-6">
          <h2 class="text-lg font-bold text-slate-800 mb-1">Pilih Paket Try Out</h2>
          <p class="text-sm text-slate-500 mb-5">Setiap paket berisi soal dengan wacana/topik berbeda, dikerjakan terpisah.</p>
          <div class="space-y-3">${rows}</div>
        </div>
      </div>
      <div id="lbModal"></div>
    `;
    document.getElementById('btnLogout').addEventListener('click', () => { state.screen = 'login'; render(); });
    document.querySelectorAll('.btnStart').forEach(b => b.addEventListener('click', () => {
      state.activePackage = PACKAGES.find(p => p.id === b.dataset.pkg);
      state.screen = 'confirm';
      render();
    }));
    document.querySelectorAll('.btnLeaderboard').forEach(b => b.addEventListener('click', () => openLeaderboard(b.dataset.pkg)));
  }

  function renderConfirm() {
    const pkg = state.activePackage;
    const nSoal = pkg.range[1] - pkg.range[0] + 1;
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8 fade-in text-center">
          <h2 class="text-lg font-bold text-slate-800 mb-2">${pkg.name}</h2>
          <p class="text-sm text-slate-500 mb-4">${pkg.description}</p>
          <div class="grid grid-cols-2 gap-3 mb-6 text-sm">
            <div class="bg-slate-50 rounded-lg py-3"><p class="text-slate-400">Jumlah Soal</p><p class="font-bold text-slate-800">${nSoal}</p></div>
            <div class="bg-slate-50 rounded-lg py-3"><p class="text-slate-400">Durasi</p><p class="font-bold text-slate-800">${pkg.durationMinutes} menit</p></div>
          </div>
          <p class="text-xs text-slate-500 mb-6">Timer berjalan otomatis setelah Anda menekan mulai. Jawaban tersimpan otomatis di perangkat Anda.</p>
          <div class="flex gap-3">
            <button id="btnBack" class="flex-1 py-2.5 rounded-lg border border-slate-300 hover:bg-slate-50">Kembali</button>
            <button id="btnConfirm" class="flex-1 py-2.5 rounded-lg bg-blue-900 hover:bg-blue-800 text-white font-semibold">Mulai Ujian</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('btnBack').addEventListener('click', () => { state.screen = 'packages'; render(); });
    document.getElementById('btnConfirm').addEventListener('click', startExam);
  }

  function startExam() {
    const pkg = state.activePackage;
    const st = getPackageStatus(pkg.id);
    state.answers = st.answers && st.status === 'sedang' ? Object.assign({}, st.answers) : {};
    state.flagged = new Set();
    state.currentIndex = 0;
    state.timeLeft = st.status === 'sedang' && st.timeLeft ? st.timeLeft : pkg.durationMinutes * 60;
    setPackageStatus(pkg.id, { status: 'sedang', answers: state.answers, timeLeft: state.timeLeft });
    state.screen = 'exam';
    render();
    state.timerHandle = setInterval(tick, 1000);
  }

  function tick() {
    state.timeLeft--;
    if (state.timeLeft <= 0) {
      clearInterval(state.timerHandle);
      finishExam();
      return;
    }
    const el = document.getElementById('timerDisplay');
    if (el) el.textContent = formatTime(state.timeLeft);
    if (state.timeLeft % 5 === 0) {
      setPackageStatus(state.activePackage.id, { timeLeft: state.timeLeft, answers: state.answers });
    }
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function renderExam() {
    const pkg = state.activePackage;
    const questions = getQuestionsForPackage(pkg);
    const q = questions[state.currentIndex];
    const text = q.textId ? TEXTS[q.textId] : null;

    app.innerHTML = `
      <div class="min-h-screen flex flex-col bg-slate-100 no-select">
        <header class="bg-blue-950 text-white px-4 py-3 flex flex-wrap items-center justify-between gap-2 shadow">
          <div class="flex items-center gap-3">
            <span id="timerDisplay" class="font-mono text-lg font-bold bg-blue-900 px-3 py-1 rounded-lg">${formatTime(state.timeLeft)}</span>
            <div class="hidden sm:block">
              <p class="text-sm font-semibold leading-tight">${state.student.name}</p>
              <p class="text-xs text-blue-200 leading-tight">${state.student.school}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex items-center bg-blue-900 rounded-lg overflow-hidden text-sm">
              <button id="fontMinus" class="px-2.5 py-1.5 hover:bg-blue-800">A-</button>
              <button id="fontMid" class="px-2.5 py-1.5 hover:bg-blue-800 border-x border-blue-800">A</button>
              <button id="fontPlus" class="px-2.5 py-1.5 hover:bg-blue-800">A+</button>
            </div>
            <button id="btnGrid" class="text-sm px-3 py-1.5 rounded-lg border border-blue-300 hover:bg-blue-900">Daftar Soal</button>
          </div>
        </header>

        <main class="flex-1 grid grid-cols-1 md:grid-cols-2 overflow-hidden">
          <section class="border-r border-slate-200 bg-white overflow-y-auto p-5" id="panelLeft" style="font-size:${state.fontScale}rem">
            ${text ? `
              <p class="text-xs font-semibold text-blue-800 uppercase tracking-wide mb-1">${text.type}</p>
              <h3 class="font-bold text-slate-800 mb-3">${text.title}</h3>
              <div class="whitespace-pre-line text-slate-700 leading-relaxed">${escapeHtml(text.body)}</div>
            ` : `
              <div class="h-full flex items-center justify-center text-slate-400 text-sm text-center px-6">
                Soal ini berdiri sendiri (vocabulary / language use) — tidak memerlukan teks bacaan pendukung.
              </div>
            `}
          </section>

          <section class="overflow-y-auto p-5" id="panelRight" style="font-size:${state.fontScale}rem">
            <p class="text-xs font-semibold text-slate-400 mb-2">Soal ${state.currentIndex + 1} dari ${questions.length}</p>
            <div id="questionBody"></div>
          </section>
        </main>

        <footer class="bg-white border-t border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-2">
          <button id="btnPrev" class="px-4 py-2 rounded-lg border border-slate-300 text-sm hover:bg-slate-50 disabled:opacity-40" ${state.currentIndex === 0 ? 'disabled' : ''}>Sebelumnya</button>
          <button id="btnFlag" class="px-4 py-2 rounded-lg text-sm font-medium ${state.flagged.has(q.id) ? 'bg-yellow-400 text-yellow-900' : 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'}">${state.flagged.has(q.id) ? '✓ Ragu-Ragu' : 'Ragu-Ragu'}</button>
          <button id="btnNext" class="px-4 py-2 rounded-lg text-sm font-semibold text-white ${state.currentIndex === questions.length - 1 ? 'bg-green-700 hover:bg-green-800' : 'bg-blue-900 hover:bg-blue-800'}">${state.currentIndex === questions.length - 1 ? 'Selesai' : 'Berikutnya'}</button>
        </footer>
      </div>
      <div id="gridModal"></div>
    `;

    renderQuestionBody(q);

    document.getElementById('fontMinus').addEventListener('click', () => adjustFont(-0.1));
    document.getElementById('fontMid').addEventListener('click', () => { state.fontScale = 1; applyFont(); });
    document.getElementById('fontPlus').addEventListener('click', () => adjustFont(0.1));
    document.getElementById('btnGrid').addEventListener('click', openGrid);
    document.getElementById('btnPrev').addEventListener('click', () => go(-1));
    document.getElementById('btnNext').addEventListener('click', () => {
      if (state.currentIndex === questions.length - 1) { confirmFinish(); }
      else go(1);
    });
    document.getElementById('btnFlag').addEventListener('click', () => {
      if (state.flagged.has(q.id)) state.flagged.delete(q.id); else state.flagged.add(q.id);
      render();
    });
  }

  function adjustFont(delta) {
    state.fontScale = Math.min(1.4, Math.max(0.8, +(state.fontScale + delta).toFixed(1)));
    applyFont();
  }
  function applyFont() {
    const l = document.getElementById('panelLeft'); const r = document.getElementById('panelRight');
    if (l) l.style.fontSize = state.fontScale + 'rem';
    if (r) r.style.fontSize = state.fontScale + 'rem';
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderQuestionBody(q) {
    const container = document.getElementById('questionBody');
    let html = `<p class="font-medium text-slate-800 mb-4">${escapeHtml(q.question)}</p>`;

    if (q.type === 'single') {
      const letters = ['A','B','C','D','E'];
      html += '<div class="space-y-2">' + q.options.map((opt, i) => {
        const letter = letters[i];
        const checked = state.answers[q.id] === letter;
        return `
          <label class="flex items-start gap-3 border rounded-lg px-3 py-2.5 cursor-pointer transition ${checked ? 'border-blue-700 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}">
            <input type="radio" name="q${q.id}" value="${letter}" class="mt-1" ${checked ? 'checked' : ''} />
            <span><span class="font-semibold mr-1">${letter}.</span>${escapeHtml(opt)}</span>
          </label>`;
      }).join('') + '</div>';
    } else if (q.type === 'multi') {
      const letters = ['A','B','C','D','E'];
      const current = state.answers[q.id] || [];
      html += '<p class="text-xs text-slate-400 mb-2">Pilih semua jawaban yang benar.</p><div class="space-y-2">' + q.options.map((opt, i) => {
        const letter = letters[i];
        const checked = current.includes(letter);
        return `
          <label class="flex items-start gap-3 border rounded-lg px-3 py-2.5 cursor-pointer transition ${checked ? 'border-blue-700 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}">
            <input type="checkbox" data-letter="${letter}" class="mt-1 multiChk" ${checked ? 'checked' : ''} />
            <span><span class="font-semibold mr-1">${letter}.</span>${escapeHtml(opt)}</span>
          </label>`;
      }).join('') + '</div>';
    } else if (q.type === 'table') {
      const current = state.answers[q.id] || {};
      html += '<div class="overflow-x-auto"><table class="w-full text-sm border border-slate-200 rounded-lg overflow-hidden">';
      html += `<thead class="bg-slate-100"><tr><th class="text-left px-3 py-2">Pernyataan</th><th class="px-3 py-2 w-24">Benar</th><th class="px-3 py-2 w-24">Salah</th></tr></thead><tbody>`;
      q.statements.forEach((s, i) => {
        const val = current[i];
        html += `<tr class="border-t border-slate-200">
          <td class="px-3 py-2">${escapeHtml(s)}</td>
          <td class="text-center"><input type="radio" name="q${q.id}s${i}" data-idx="${i}" data-val="true" class="tableRadio" ${val === true ? 'checked' : ''} /></td>
          <td class="text-center"><input type="radio" name="q${q.id}s${i}" data-idx="${i}" data-val="false" class="tableRadio" ${val === false ? 'checked' : ''} /></td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }

    container.innerHTML = html;

    if (q.type === 'single') {
      container.querySelectorAll(`input[name="q${q.id}"]`).forEach(inp => {
        inp.addEventListener('change', () => { state.answers[q.id] = inp.value; persistAnswers(); });
      });
    } else if (q.type === 'multi') {
      container.querySelectorAll('.multiChk').forEach(inp => {
        inp.addEventListener('change', () => {
          let cur = new Set(state.answers[q.id] || []);
          if (inp.checked) cur.add(inp.dataset.letter); else cur.delete(inp.dataset.letter);
          state.answers[q.id] = Array.from(cur);
          persistAnswers();
        });
      });
    } else if (q.type === 'table') {
      container.querySelectorAll('.tableRadio').forEach(inp => {
        inp.addEventListener('change', () => {
          let cur = Object.assign({}, state.answers[q.id] || {});
          cur[inp.dataset.idx] = inp.dataset.val === 'true';
          state.answers[q.id] = cur;
          persistAnswers();
        });
      });
    }
  }

  function persistAnswers() {
    setPackageStatus(state.activePackage.id, { answers: state.answers, timeLeft: state.timeLeft, status: 'sedang' });
  }

  function go(delta) {
    const questions = getQuestionsForPackage(state.activePackage);
    state.currentIndex = Math.min(questions.length - 1, Math.max(0, state.currentIndex + delta));
    render();
  }

  function jumpTo(idx) {
    state.currentIndex = idx;
    render();
    closeGrid();
  }

  function openGrid() {
    const questions = getQuestionsForPackage(state.activePackage);
    const cells = questions.map((q, i) => {
      let cls = 'bg-white border-slate-300 text-slate-600';
      const answered = state.answers[q.id] !== undefined && state.answers[q.id] !== null &&
        (Array.isArray(state.answers[q.id]) ? state.answers[q.id].length > 0 :
         (typeof state.answers[q.id] === 'object' ? Object.keys(state.answers[q.id]).length === q.statements.length : true));
      if (state.flagged.has(q.id)) cls = 'bg-yellow-300 border-yellow-500 text-yellow-900';
      else if (answered) cls = 'bg-green-500 border-green-600 text-white';
      return `<button data-idx="${i}" class="gridCell w-10 h-10 rounded-lg border text-sm font-semibold ${cls}">${i + 1}</button>`;
    }).join('');

    document.getElementById('gridModal').innerHTML = `
      <div class="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-40 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-5 fade-in">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-slate-800">Daftar Soal</h3>
            <button id="closeGrid" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
          </div>
          <div class="flex gap-4 text-xs mb-3 text-slate-500">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-500 inline-block"></span> Terjawab</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-yellow-300 inline-block"></span> Ragu-Ragu</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-white border border-slate-300 inline-block"></span> Belum</span>
          </div>
          <div class="grid grid-cols-6 sm:grid-cols-8 gap-2 mb-4">${cells}</div>
          <button id="btnFinishFromGrid" class="w-full py-2.5 rounded-lg bg-green-700 hover:bg-green-800 text-white font-semibold text-sm">Selesaikan Ujian</button>
        </div>
      </div>
    `;
    document.getElementById('closeGrid').addEventListener('click', closeGrid);
    document.getElementById('btnFinishFromGrid').addEventListener('click', () => { closeGrid(); confirmFinish(); });
    document.querySelectorAll('.gridCell').forEach(b => b.addEventListener('click', () => jumpTo(+b.dataset.idx)));
  }
  function closeGrid() { document.getElementById('gridModal').innerHTML = ''; }

  function confirmFinish() {
    if (confirm('Yakin ingin menyelesaikan ujian? Jawaban tidak dapat diubah setelah ini.')) finishExam();
  }

  function finishExam() {
    if (state.timerHandle) clearInterval(state.timerHandle);
    const pkg = state.activePackage;
    const questions = getQuestionsForPackage(pkg);
    let correct = 0;
    const details = questions.map(q => {
      let isCorrect = false;
      const given = state.answers[q.id];
      if (q.type === 'single') isCorrect = given === q.answer;
      else if (q.type === 'multi') {
        const g = (given || []).slice().sort().join(',');
        const a = q.answers.slice().sort().join(',');
        isCorrect = g === a;
      } else if (q.type === 'table') {
        isCorrect = q.statements.every((_, i) => given && given[i] === q.answersTable[i]);
      }
      if (isCorrect) correct++;
      return { q, given, isCorrect };
    });
    const score = Math.round((correct / questions.length) * 100);
    state.lastResult = { pkg, details, correct, total: questions.length, score };
    setPackageStatus(pkg.id, { status: 'selesai', score, answers: state.answers, timeLeft: 0 });
    submitToLeaderboard(pkg.id, score);
    state.screen = 'result';
    render();
  }

  function renderResult() {
    const r = state.lastResult;
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8 text-center fade-in">
          <p class="text-sm text-slate-500 mb-1">${r.pkg.name}</p>
          <div class="text-5xl font-extrabold text-blue-900 my-4">${r.score}</div>
          <p class="text-sm text-slate-600 mb-6">${r.correct} dari ${r.total} soal benar</p>
          <div class="space-y-2">
            <button id="btnReview" class="w-full py-2.5 rounded-lg bg-blue-900 hover:bg-blue-800 text-white font-semibold">Lihat Pembahasan</button>
            <button id="btnLeaderboard" class="w-full py-2.5 rounded-lg border border-slate-300 hover:bg-slate-50">Lihat Peringkat</button>
            <button id="btnOtherPkg" class="w-full py-2.5 rounded-lg border border-slate-300 hover:bg-slate-50">Pilih Paket Lain</button>
          </div>
        </div>
      </div>
      <div id="lbModal"></div>
    `;
    document.getElementById('btnReview').addEventListener('click', () => { state.screen = 'review'; render(); });
    document.getElementById('btnLeaderboard').addEventListener('click', () => openLeaderboard(r.pkg.id));
    document.getElementById('btnOtherPkg').addEventListener('click', () => { state.screen = 'packages'; render(); });
  }

  function renderReview() {
    const r = state.lastResult;
    const letters = ['A','B','C','D','E'];
    const items = r.details.map((d, i) => {
      const q = d.q;
      let bodyHtml = '';
      if (q.type === 'single') {
        bodyHtml = q.options.map((opt, idx) => {
          const letter = letters[idx];
          let cls = 'border-slate-200';
          if (letter === q.answer) cls = 'border-green-500 bg-green-50';
          else if (letter === d.given && !d.isCorrect) cls = 'border-red-500 bg-red-50';
          return `<div class="border rounded-lg px-3 py-2 text-sm ${cls}"><span class="font-semibold mr-1">${letter}.</span>${escapeHtml(opt)}</div>`;
        }).join('<div class="h-1.5"></div>');
      } else if (q.type === 'multi') {
        bodyHtml = q.options.map((opt, idx) => {
          const letter = letters[idx];
          const isKey = q.answers.includes(letter);
          const wasGiven = (d.given || []).includes(letter);
          let cls = 'border-slate-200';
          if (isKey) cls = 'border-green-500 bg-green-50';
          else if (wasGiven) cls = 'border-red-500 bg-red-50';
          return `<div class="border rounded-lg px-3 py-2 text-sm ${cls}"><span class="font-semibold mr-1">${letter}.</span>${escapeHtml(opt)}</div>`;
        }).join('<div class="h-1.5"></div>');
      } else if (q.type === 'table') {
        bodyHtml = '<div class="overflow-x-auto"><table class="w-full text-sm border border-slate-200 rounded-lg overflow-hidden"><tbody>' +
          q.statements.map((s, idx) => {
            const key = q.answersTable[idx];
            const given = d.given ? d.given[idx] : undefined;
            const ok = given === key;
            return `<tr class="border-t border-slate-200 ${ok ? 'bg-green-50' : 'bg-red-50'}"><td class="px-3 py-2">${escapeHtml(s)}</td><td class="px-3 py-2 text-xs font-semibold">Kunci: ${key ? 'Benar' : 'Salah'}<br class="sm:hidden">Jawaban Anda: ${given === undefined ? '-' : (given ? 'Benar' : 'Salah')}</td></tr>`;
          }).join('') + '</tbody></table></div>';
      }
      return `
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs font-bold px-2 py-0.5 rounded-full ${d.isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${d.isCorrect ? 'Benar' : 'Salah'}</span>
            <span class="text-xs text-slate-400">Soal ${i + 1}</span>
          </div>
          <p class="font-medium text-slate-800 mb-3">${escapeHtml(q.question)}</p>
          <div class="mb-3">${bodyHtml}</div>
          <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-slate-700">
            <span class="font-semibold text-blue-800">Pembahasan: </span>${escapeHtml(q.explanation)}
          </div>
        </div>`;
    }).join('<div class="h-4"></div>');

    app.innerHTML = `
      <div class="min-h-screen bg-slate-100">
        <div class="bg-blue-950 text-white px-4 py-4 sticky top-0 z-10">
          <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div>
              <p class="font-semibold text-sm">${r.pkg.name}</p>
              <p class="text-xs text-blue-200">Skor: ${r.score} (${r.correct}/${r.total} benar)</p>
            </div>
            <button id="btnBackResult" class="text-xs px-3 py-1.5 rounded-lg border border-blue-300 hover:bg-blue-900">Kembali</button>
          </div>
        </div>
        <div class="max-w-2xl mx-auto p-4 sm:p-6">${items}</div>
      </div>
    `;
    document.getElementById('btnBackResult').addEventListener('click', () => { state.screen = 'packages'; render(); });
  }

  // ---------- Leaderboard (Google Sheets via Apps Script) ----------
  function leaderboardConfigured() {
    return GAS_WEB_APP_URL && !GAS_WEB_APP_URL.startsWith('PASTE_');
  }

  async function submitToLeaderboard(pkgId, score) {
    if (!leaderboardConfigured()) return;
    try {
      await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
        body: JSON.stringify({ pkgId, name: state.student.name, school: state.student.school, score })
      });
    } catch (e) { console.warn('Gagal mengirim skor ke leaderboard:', e); }
  }

  function openLeaderboard(pkgId) {
    let target = document.getElementById('lbModal');
    if (!target) {
      target = document.createElement('div');
      target.id = 'lbModal';
      document.body.appendChild(target);
    }
    const options = PACKAGES.map(p => `<option value="${p.id}" ${p.id === pkgId ? 'selected' : ''}>${p.name}</option>`).join('');
    target.innerHTML = `
      <div class="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-40 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-5 fade-in">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-slate-800">Peringkat</h3>
            <button id="closeLb" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
          </div>
          <select id="lbPkgSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 text-sm">${options}</select>
          <div id="lbList" class="space-y-1 max-h-72 overflow-y-auto text-sm">Memuat...</div>
          <button id="btnRefreshLb" class="w-full mt-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-medium">🔄 Refresh Peringkat</button>
          ${!leaderboardConfigured() ? '<p class="text-xs text-amber-600 mt-3">Leaderboard belum aktif — GAS_WEB_APP_URL di kode belum diisi.</p>' : ''}
        </div>
      </div>
    `;
    document.getElementById('closeLb').addEventListener('click', () => { target.innerHTML = ''; });
    document.getElementById('lbPkgSelect').addEventListener('change', (e) => loadLeaderboard(e.target.value));
    document.getElementById('btnRefreshLb').addEventListener('click', () => loadLeaderboard(document.getElementById('lbPkgSelect').value));
    loadLeaderboard(pkgId);
  }

  async function loadLeaderboard(pkgId) {
    const list = document.getElementById('lbList');
    if (!list) return;
    if (!leaderboardConfigured()) {
      list.innerHTML = '<p class="text-slate-400 text-center py-6">Belum ada data (leaderboard belum dikonfigurasi).</p>';
      return;
    }
    list.innerHTML = 'Memuat...';
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?pkgId=${encodeURIComponent(pkgId)}`);
      const data = await res.json();
      const entries = (data && data.entries) ? data.entries : [];
      if (entries.length === 0) { list.innerHTML = '<p class="text-slate-400 text-center py-6">Belum ada peserta untuk paket ini.</p>'; return; }
      list.innerHTML = entries.map((e, i) => `
        <div class="flex items-center justify-between px-3 py-2 rounded-lg ${i < 3 ? 'bg-yellow-50' : 'bg-slate-50'}">
          <div class="min-w-0 pr-2"><span class="font-semibold mr-2">#${i + 1}</span><span class="break-words">${escapeHtml(e.name)}</span> <span class="text-xs text-slate-400 break-words">(${escapeHtml(e.school || '')})</span></div>
          <span class="font-bold text-blue-900 shrink-0">${e.score}</span>
        </div>`).join('');
    } catch (e) {
      list.innerHTML = '<p class="text-red-500 text-center py-6 text-sm">Gagal memuat leaderboard. Coba tekan Refresh lagi.</p>';
    }
  }

  render();
})();
</script>
</body>
</html>
