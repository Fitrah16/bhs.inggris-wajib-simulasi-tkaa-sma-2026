  { id: 156, textId: "t21", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Pak Darto originally caught just enough fish to feed his family.", "The golden fish granted Pak Darto three wishes.", "Pak Darto's second boat allowed him to catch more fish than his village could sell.", "Pak Darto felt no regret after wasting the extra fish."], answersTable: [true, false, true, false], explanation: "(1) Benar. (2) Salah — ikan emas hanya mengabulkan dua permintaan. (3) Benar. (4) Salah — Pak Darto menyadari ia telah menyia-nyiakan keberuntungannya." },

  { id: 157, textId: "t22", type: "single", level: "C2", question: "What is the writer's main argument in this text?", options: ["Private vehicles should be completely banned in cities", "Expanding public transportation is an effective way to reduce traffic congestion", "Public transportation is always cheaper than owning a car", "Traffic congestion cannot be solved by any means", "Cities should stop growing to avoid traffic problems"], answer: "B", explanation: "Teks ini berargumen bahwa perluasan sistem transportasi umum adalah solusi efektif untuk mengurangi kemacetan." },
  { id: 158, textId: "t22", type: "single", level: "C3", question: "The word 'emissions' in paragraph 3 is closest in meaning to...", options: ["passengers", "pollutants released into the air", "fuel costs", "traffic signals", "road repairs"], answer: "B", explanation: "'Emissions' merujuk pada zat pencemar yang dilepaskan ke udara." },
  { id: 159, textId: "t22", type: "single", level: "C4", question: "What can be inferred from the statement that public transportation 'can carry many passengers at once'?", options: ["It requires more fuel per passenger than private cars", "It is generally less efficient in reducing air pollution than private cars", "It can help produce less emissions per passenger compared to individual cars", "It is only suitable for short-distance travel", "It cannot be used during rush hour"], answer: "C", explanation: "Karena mengangkut banyak penumpang sekaligus, transportasi umum menghasilkan lebih sedikit emisi per penumpang." },
  { id: 160, textId: "t22", type: "single", level: "C3", question: "According to paragraph 4, why can public transportation lower transportation costs for city residents?", options: ["Because governments subsidize all private vehicles", "Because owning and maintaining a private vehicle is generally more expensive", "Because public transportation tickets are always free", "Because fuel prices only affect private car owners", "Because public transportation does not require any payment"], answer: "B", explanation: "Memiliki dan merawat kendaraan pribadi umumnya lebih mahal dibandingkan menggunakan transportasi umum." },
  { id: 161, textId: "t22", type: "multi", question: "According to the text, which of the following are benefits of public transportation mentioned by the writer? (Choose TWO)", options: ["It reduces the number of private vehicles on the road", "It eliminates the need for traffic laws", "It helps reduce air pollution in cities", "It guarantees shorter working hours for commuters", "It replaces the need for road maintenance"], answers: ["A","C"], explanation: "Manfaat yang disebutkan meliputi berkurangnya jumlah kendaraan pribadi dan berkurangnya polusi udara." },
  { id: 162, textId: "t22", type: "table", question: "Based on the text, decide whether each statement is APPROPRIATE (Tepat) or NOT APPROPRIATE (Tidak Tepat).", statements: ["The writer believes traffic congestion is an unsolvable problem.", "Buses and trains generally produce less emissions per passenger than cars.", "Owning a private vehicle is generally cheaper than using public transportation.", "The writer encourages city governments to invest in public transportation."], answersTable: [false, true, false, true], explanation: "(1) Tidak Tepat — penulis menawarkan solusi. (2) Tepat. (3) Tidak Tepat. (4) Tepat." },

  { id: 163, textId: "t23", type: "single", level: "C2", question: "What is the purpose of this email?", options: ["To request a meeting with the HR manager", "To apply for a marketing internship position", "To complain about a job interview process", "To ask about the company's internship policy", "To resign from an internship position"], answer: "B", explanation: "Email ini ditulis untuk melamar posisi magang pemasaran yang diiklankan di situs resmi perusahaan." },
  { id: 164, textId: "t23", type: "single", level: "C3", question: "According to the email, what experience does Alya mention to support her application?", options: ["Working as a professional photographer", "Managing a faculty seminar's Instagram account, which grew significantly", "Leading a national marketing campaign", "Completing a marketing certification course", "Interning at another media company"], answer: "B", explanation: "Alya menyebutkan pengalamannya mengelola akun Instagram seminar tahunan fakultasnya yang tumbuh signifikan." },
  { id: 165, textId: "t23", type: "single", level: "C4", question: "What can be inferred about why Alya is interested in Greenfield Media specifically?", options: ["It is the only company offering internships in her city", "She admires the company's reputation for creative digital campaigns", "A friend recommended the company to her", "It offers the highest-paid internship available", "It is close to her university"], answer: "B", explanation: "Alya tertarik pada Greenfield Media karena reputasinya yang kuat dalam kampanye digital kreatif." },
  { id: 166, textId: "t23", type: "multi", question: "According to the email, which of the following documents did Alya attach? (Choose TWO)", options: ["Resume", "Recommendation letter from a professor", "Portfolio", "Bank statement", "Health certificate"], answers: ["A","C"], explanation: "Alya melampirkan resume, portofolio, dan transkrip akademik." },
  { id: 167, textId: "t23", type: "table", question: "Based on the email, decide whether each statement is TRUE or FALSE.", statements: ["Alya is currently a final-year Communication Studies student.", "Alya has professional work experience in marketing at another company.", "Alya attached her academic transcript to the email.", "Alya requested an immediate response within 24 hours."], answersTable: [true, false, true, false], explanation: "(1) Benar. (2) Salah — pengalamannya berasal dari organisasi mahasiswa. (3) Benar. (4) Salah — tidak ada tenggat waktu spesifik yang diminta." },

  { id: 168, textId: "t24", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The process of coral reef formation only", "The importance and threats to coral reefs as marine ecosystems", "The tourism industry related to diving", "The history of coral reef discovery", "A comparison between coral reefs and rainforests"], answer: "B", explanation: "Teks report ini menjelaskan pentingnya terumbu karang bagi ekosistem laut serta ancaman yang dihadapinya." },
  { id: 169, textId: "t24", type: "single", level: "C3", question: "The word 'symbiotic' in paragraph 2 is closest in meaning to...", options: ["competitive", "mutually beneficial", "harmful", "temporary", "accidental"], answer: "B", explanation: "'Symbiotic relationship' berarti hubungan yang saling menguntungkan." },
  { id: 170, textId: "t24", type: "single", level: "C4", question: "What can be inferred from the process described as 'coral bleaching'?", options: ["It is a natural and harmless color change in coral", "It is a sign of stress in coral caused by rising water temperatures", "It only happens to artificial coral reefs", "It helps coral grow faster", "It is caused exclusively by overfishing"], answer: "B", explanation: "Ketika suhu air terlalu tinggi, karang mengeluarkan zooxanthellae, menyebabkan pemutihan yang merupakan tanda stres." },
  { id: 171, textId: "t24", type: "multi", question: "According to the text, which of the following are benefits of coral reefs for humans? (Choose TWO)", options: ["Protecting coastlines from strong waves and storms", "Producing fresh drinking water", "Supporting local fishing industries", "Preventing all forms of ocean pollution", "Reducing the need for coastal roads"], answers: ["A","C"], explanation: "Terumbu karang melindungi garis pantai dari gelombang kuat dan badai, serta mendukung industri perikanan lokal." },
  { id: 172, textId: "t24", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Coral reefs cover more than fifty percent of the ocean floor.", "Coral polyps secrete calcium carbonate to build their skeletons.", "Rising ocean temperatures can cause coral bleaching.", "Many countries have established marine protected areas to protect coral reefs."], answersTable: [false, true, true, true], explanation: "(1) Salah — kurang dari satu persen dasar laut. (2) Benar. (3) Benar. (4) Benar." },

  { id: 173, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'thorough'.", options: ["careless", "complete and detailed", "brief", "uncertain", "casual"], answer: "B", explanation: "'Thorough' berarti menyeluruh dan terperinci." },
  { id: 174, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'transparent'.", options: ["clear", "obvious", "hidden", "visible", "honest"], answer: "C", explanation: "'Transparent' berarti jelas/terbuka, sehingga lawan katanya adalah 'hidden'." },
  { id: 175, textId: null, type: "single", level: "C3", question: "The company decided to phase in the new software gradually across all departments. The phrasal verb 'phase in' means...", options: ["to remove completely", "to introduce something gradually", "to cancel a plan", "to test something once", "to postpone indefinitely"], answer: "B", explanation: "'Phase in' berarti memperkenalkan sesuatu secara bertahap." },
  { id: 176, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The museum's new exhibit received excellent reviews; ____, visitor numbers increased dramatically.'", options: ["consequently", "although", "for example", "in contrast", "meanwhile"], answer: "A", explanation: "Kalimat kedua adalah akibat dari kalimat pertama, sehingga konektor yang tepat adalah 'consequently'." },
  { id: 177, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The two companies signed a partnership agreement, and ____ plan to launch a joint project next year.'", options: ["it", "he", "they", "this", "she"], answer: "C", explanation: "Kata ganti 'they' merujuk pada 'the two companies' yang bersifat jamak." },
  { id: 178, textId: null, type: "single", level: "C4", question: "'Although ticket prices increased, attendance at the concert remained high.' What does this sentence imply?", options: ["The price increase caused attendance to drop significantly", "Attendance stayed strong despite the higher ticket prices", "The concert was cancelled due to low attendance", "Ticket prices decreased before the concert", "The concert only attracted a small audience"], answer: "B", explanation: "'Although' menunjukkan kontras: meskipun harga tiket naik, jumlah penonton tetap tinggi." },
  { id: 179, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'vast'? (Choose TWO)", options: ["huge", "tiny", "immense", "narrow", "minor"], answers: ["A","C"], explanation: "'Vast' berarti sangat luas, sinonimnya adalah 'huge' dan 'immense'." },
  { id: 180, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The manager asked the team to come up with new ideas for the campaign. [generate]", "She decided to hold off the announcement until next week. [make immediately]", "The engineers worked to iron out the remaining problems in the design. [resolve]", "He always follows up with clients after a meeting. [checks in again]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'come up with' berarti menghasilkan ide. (2) Tidak Sesuai — 'hold off' berarti menunda, bukan segera dilakukan. (3) Sesuai — 'iron out' berarti menyelesaikan masalah. (4) Sesuai — 'follow up' berarti menindaklanjuti." }
);

QUESTIONS.push(
  { id: 181, textId: "t25", type: "single", level: "C2", question: "What is the text mainly about?", options: ["A guide on how to become a professional surfer", "The writer's personal experience learning to surf during a holiday", "A comparison between surfing and swimming", "An announcement about a surfing lesson package", "The history of surfing in West Java"], answer: "B", explanation: "Teks recount ini menceritakan pengalaman pribadi penulis belajar berselancar bersama teman-temannya saat liburan." },

  { id: 183, textId: "t25", type: "single", level: "C4", question: "What can be inferred about the writer's overall feeling about the trip?", options: ["The writer regretted trying to learn surfing", "The writer found the experience enjoyable despite the difficulties", "The writer felt embarrassed and wanted to quit immediately", "The writer was indifferent about the whole experience", "The writer became a skilled surfer by the end of the trip"], answer: "B", explanation: "Meskipun sering jatuh, pengalaman tersebut dianggap sebagai salah satu bagian paling menyenangkan dari liburan mereka." },
  { id: 184, textId: "t25", type: "single", level: "C3", question: "According to the text, what happened just before the lesson ended?", options: ["The writer gave up trying to surf", "The writer managed to catch a small wave and stand briefly", "The instructor cancelled the rest of the lesson", "The writer's friends left the beach early", "A big wave knocked everyone off their boards"], answer: "B", explanation: "Penulis berhasil menangkap ombak kecil dan berdiri sebentar sebelum kehilangan keseimbangan lagi." },
  { id: 185, textId: "t25", type: "multi", question: "According to the text, which of the following are TRUE? (Choose TWO)", options: ["The writer had surfed before this trip", "The lesson began with practice on dry sand", "The writer swallowed seawater while practicing in the water", "The instructor refused to teach beginners", "The writer became a professional surfer after the trip"], answers: ["B","C"], explanation: "Pelajaran dimulai dengan latihan di pasir kering, dan penulis menelan cukup banyak air laut saat berlatih di air." },
  { id: 186, textId: "t25", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["The writer visited the beach alone.", "The instructor's name was Kang Ujang.", "The writer managed to ride a wave for about five seconds.", "The writer and friends considered the trip a complete failure."], answersTable: [false, true, true, false], explanation: "(1) Salah — ia pergi bersama dua teman dekat. (2) Benar. (3) Benar. (4) Salah — mereka menganggap pengalaman itu menyenangkan." },

  { id: 187, textId: "t26", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The location of rainforests around the world", "The ecological importance and threats facing rainforests", "How to plant trees in a rainforest", "The history of deforestation", "A comparison between rainforests and deserts"], answer: "B", explanation: "Teks report ini menjelaskan pentingnya hutan hujan secara ekologis serta ancaman yang dihadapinya." },
  { id: 188, textId: "t26", type: "single", level: "C3", question: "The word 'transpiration' in paragraph 3 is closest in meaning to...", options: ["the process of trees releasing water vapor into the atmosphere", "the process of animals breathing underwater", "the process of soil absorbing minerals", "the process of trees losing their leaves", "the process of rain falling directly into rivers"], answer: "A", explanation: "'Transpiration' merujuk pada proses tumbuhan melepaskan uap air ke atmosfer." },
  { id: 189, textId: "t26", type: "single", level: "C4", question: "What can be inferred from the nickname 'the lungs of the Earth' given to rainforests?", options: ["Rainforests physically resemble human lungs", "Rainforests play a vital role in producing oxygen and absorbing carbon dioxide", "Rainforests are the only source of oxygen on Earth", "Rainforests are located near the Earth's poles", "Rainforests cannot survive without human intervention"], answer: "B", explanation: "Julukan tersebut menyiratkan peran penting hutan hujan dalam memproduksi oksigen dan menyerap karbon dioksida." },
  { id: 190, textId: "t26", type: "single", level: "C3", question: "According to the text, what has contributed to the shrinking of rainforests?", options: ["Excessive rainfall", "Logging, agricultural expansion, and mining activities", "Natural forest fires only", "Overpopulation of wildlife", "Changes in ocean currents"], answer: "B", explanation: "Penebangan hutan, perluasan lahan pertanian, dan aktivitas pertambangan disebut sebagai penyebab menyusutnya hutan hujan." },
  { id: 191, textId: "t26", type: "multi", question: "According to the text, which of the following are functions of rainforests mentioned by the writer? (Choose TWO)", options: ["Regulating the global climate", "Producing all of the world's fresh water", "Playing a role in the water cycle", "Preventing all natural disasters", "Providing homes for every ocean species"], answers: ["A","C"], explanation: "Teks menyebutkan hutan hujan berperan dalam mengatur iklim global dan siklus air." },
  { id: 192, textId: "t26", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Rainforests cover more than fifty percent of the Earth's land surface.", "Rainforests are home to more than half of the world's known species.", "Some modern medicines were developed from rainforest plants.", "Deforestation can reduce rainfall in surrounding areas."], answersTable: [false, true, true, true], explanation: "(1) Salah — kurang dari sepuluh persen. (2) Benar. (3) Benar. (4) Benar." },

  { id: 193, textId: "t27", type: "single", level: "C2", question: "What kind of text is this?", options: ["Recount text", "Report text", "Procedure text", "Narrative text", "Analytical exposition"], answer: "C", explanation: "Teks ini berisi daftar alat dan langkah bernomor untuk mengganti ban sepeda, tergolong procedure text." },
  { id: 194, textId: "t27", type: "single", level: "C3", question: "According to the text, what should be checked after removing the inner tube?", options: ["The pressure of the tire", "The inside of the tire for sharp objects that caused the puncture", "The color of the tire", "The brand of the bicycle", "The size of the wheel"], answer: "B", explanation: "Pemeriksaan bagian dalam ban dilakukan untuk mencari benda tajam yang menyebabkan bocor." },
  { id: 195, textId: "t27", type: "single", level: "C3", question: "Why should the tire be inflated slightly before being fully inflated, according to the text?", options: ["To save time during the repair", "To check that it holds air and sits evenly around the rim", "To make the tire easier to remove later", "To test the strength of the tire lever", "To reduce the weight of the bicycle"], answer: "B", explanation: "Ban dipompa sedikit terlebih dahulu untuk memeriksa apakah menahan udara dan terpasang rata pada pelek." },
  { id: 196, textId: "t27", type: "multi", question: "Which of the following tools are mentioned as needed for this repair? (Choose TWO)", options: ["Tire levers", "A screwdriver", "A bicycle pump", "A hammer", "A measuring tape"], answers: ["A","C"], explanation: "Alat yang disebutkan meliputi tuas ban dan pompa sepeda." },
  { id: 197, textId: "t27", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["A wrench is always required regardless of the wheel type.", "The inner tube should be checked for twists before the tire is put back on.", "The wheel should be reattached to the frame after the tire is repaired.", "The text recommends fully inflating the tire before checking for leaks."], answersTable: [false, true, true, false], explanation: "(1) Salah — kunci pas hanya diperlukan jika roda tidak dilengkapi tuas quick-release. (2) Benar. (3) Benar. (4) Salah — ban dipompa sedikit dulu sebelum dipompa penuh." },

  { id: 198, textId: "t28", type: "single", level: "C2", question: "What is the purpose of this announcement?", options: ["To announce a new school principal", "To inform students and parents about an update to the uniform policy", "To cancel the school uniform requirement entirely", "To announce a new school holiday schedule", "To introduce a new grading system"], answer: "B", explanation: "Pengumuman ini menginformasikan pembaruan kebijakan seragam sekolah." },
  { id: 199, textId: "t28", type: "single", level: "C3", question: "According to the announcement, on which days will the batik uniform now be worn?", options: ["Only on Wednesdays", "On Wednesdays and the first school day of each month", "Every day of the week", "Only during exam week", "On Fridays only"], answer: "B", explanation: "Seragam batik tetap dikenakan pada hari Rabu, dan kini juga pada hari sekolah pertama setiap bulan." },
  { id: 200, textId: "t28", type: "single", level: "C4", question: "What can be inferred about why the school allows a transition period for the new uniform items?", options: ["The school wants students to buy new uniforms immediately", "The school understands that students may still have the previous uniform items", "The school is discontinuing the uniform policy soon", "The school requires all students to wear identical shoes", "The transition period is unrelated to uniform costs"], answer: "B", explanation: "Siswa yang sudah memiliki seragam lama tidak wajib membeli yang baru segera, menyiratkan sekolah mempertimbangkan aspek biaya." },
  { id: 201, textId: "t28", type: "multi", question: "According to the announcement, which of the following are changes to the uniform policy? (Choose TWO)", options: ["Students may wear plain black or dark blue sports shoes", "The identity badge is no longer required", "A light jacket in the school color may be worn during outdoor activities", "The school logo has been redesigned", "Students must wear the batik uniform every day"], answers: ["A","C"], explanation: "Perubahan meliputi diperbolehkannya sepatu olahraga hitam/biru tua polos dan jaket ringan untuk kegiatan luar ruangan." },
  { id: 202, textId: "t28", type: "table", question: "Based on the announcement, decide whether each statement is TRUE or FALSE.", statements: ["The new policy takes effect from 14 July 2026.", "The identity badge requirement has been removed.", "Students are required to buy new uniforms immediately.", "Parents can contact the School Administration Office for questions."], answersTable: [true, false, false, true], explanation: "(1) Benar. (2) Salah — persyaratan lencana identitas tetap tidak berubah. (3) Salah — ada masa transisi. (4) Benar." },

  { id: 203, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'candid'.", options: ["dishonest", "frank and honest", "shy", "confused", "formal"], answer: "B", explanation: "'Candid' berarti terus terang dan jujur." },
  { id: 204, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'cautious'.", options: ["careful", "reckless", "alert", "attentive", "prudent"], answer: "B", explanation: "'Cautious' berarti berhati-hati, sehingga lawan katanya adalah 'reckless'." },
  { id: 205, textId: null, type: "single", level: "C3", question: "The board decided to rule out any further budget cuts this year. The phrasal verb 'rule out' means...", options: ["to consider seriously", "to eliminate as a possibility", "to approve immediately", "to postpone a decision", "to increase significantly"], answer: "B", explanation: "'Rule out' berarti menyingkirkan sesuatu sebagai kemungkinan." },
  { id: 206, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The factory adopted stricter safety measures; ____, the number of workplace accidents decreased significantly.'", options: ["as a result", "however", "for example", "in spite of this", "similarly"], answer: "A", explanation: "Kalimat kedua adalah akibat logis dari kalimat pertama." },
  { id: 207, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The teacher praised the students for their project, since ____ had worked very hard on it.'", options: ["it", "she", "they", "he", "this"], answer: "C", explanation: "Kata ganti 'they' merujuk pada 'the students' yang bersifat jamak." },
  { id: 208, textId: null, type: "single", level: "C4", question: "'Even though the road was closed for repairs, the delivery arrived on schedule.' What does this sentence imply?", options: ["The delivery was delayed because of the road closure", "The delivery still arrived on time despite the road closure", "The road closure was cancelled before the delivery", "The delivery company refused to make the trip", "The road was closed permanently"], answer: "B", explanation: "'Even though' menunjukkan kontras: meskipun jalan ditutup, pengiriman tetap tiba tepat waktu." },
  { id: 209, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'reluctant'? (Choose TWO)", options: ["hesitant", "eager", "unwilling", "willing", "confident"], answers: ["A","C"], explanation: "'Reluctant' berarti enggan, sinonimnya adalah 'hesitant' dan 'unwilling'." },
  { id: 210, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The committee decided to press ahead with the plan despite the criticism. [continue]", "He always plays down his achievements when talking to others. [exaggerates]", "The team had to scale back their expectations after the setback. [reduce]", "She managed to talk him into joining the project. [persuade]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'press ahead with' berarti melanjutkan. (2) Tidak Sesuai — 'play down' berarti merendahkan, bukan melebih-lebihkan. (3) Sesuai — 'scale back' berarti mengurangi. (4) Sesuai — 'talk into' berarti membujuk." }
);

QUESTIONS.push(
  { id: 211, textId: "t29", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The history of clockmaking as a craft", "An old clockmaker who eventually accepts a patient young boy as his apprentice", "A competition between two clockmakers", "A boy who repairs clocks without any training", "The closing of a small clock shop"], answer: "B", explanation: "Teks narrative ini bercerita tentang seorang tukang jam tua yang akhirnya menerima seorang anak laki-laki yang sabar sebagai muridnya." },
  { id: 212, textId: "t29", type: "single", level: "C3", question: "The word 'astonishment' in paragraph 4 is closest in meaning to...", options: ["boredom", "great surprise", "anger", "sadness", "confidence"], answer: "B", explanation: "'Astonishment' berarti keterkejutan yang besar." },
  { id: 213, textId: "t29", type: "single", level: "C4", question: "What can be inferred about why Mr. Alva initially refused to take an apprentice?", options: ["He believed no one had enough patience for such delicate work", "He did not like children in general", "He wanted to keep all his skills secret forever", "He was planning to close his shop soon", "He had tried teaching before and failed completely"], answer: "A", explanation: "Mr. Alva percaya tidak ada orang yang memiliki kesabaran cukup untuk pekerjaan yang begitu teliti." },
  { id: 214, textId: "t29", type: "single", level: "C3", question: "What test did Mr. Alva give Teo to evaluate his skills?", options: ["Repairing an entire antique clock alone", "Cleaning a set of tiny gears without damaging them", "Answering questions about clock history", "Selling a clock to a customer", "Drawing a diagram of a clock's mechanism"], answer: "B", explanation: "Mr. Alva memberi Teo tugas membersihkan roda gigi kecil tanpa merusaknya." },
  { id: 215, textId: "t29", type: "multi", question: "According to the text, which of the following are TRUE? (Choose TWO)", options: ["Teo visited the shop only once before being accepted as an apprentice", "Teo eventually took over the shop after Mr. Alva retired", "Mr. Alva taught Teo everything he knew about clockmaking", "Mr. Alva refused to teach Teo even after the test", "Teo failed the gear-cleaning test on his first attempt"], answers: ["B","C"], explanation: "Teo akhirnya mengambil alih toko setelah Mr. Alva pensiun, dan Mr. Alva mengajarkan segala yang ia ketahui tentang pembuatan jam." },
  { id: 216, textId: "t29", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Teo visited the shop every day after school for weeks before Mr. Alva spoke to him.", "Mr. Alva immediately agreed to teach Teo on the first day they met.", "Teo completed the gear-cleaning task perfectly.", "Mr. Alva eventually retired and passed the shop to Teo."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — Mr. Alva memberi tes terlebih dahulu. (3) Benar. (4) Benar." },

  { id: 217, textId: "t30", type: "single", level: "C2", question: "What is the writer's main argument in this text?", options: ["Traditional teaching methods should be completely abolished", "Project-based learning offers significant advantages that traditional methods often lack", "Memorization is the most effective way to learn", "Schools should stop assigning group projects", "Project-based learning is only suitable for university students"], answer: "B", explanation: "Teks ini berargumen bahwa pembelajaran berbasis proyek menawarkan keunggulan signifikan dibandingkan metode tradisional." },
  { id: 218, textId: "t30", type: "single", level: "C3", question: "The word 'retain' in paragraph 2 is closest in meaning to...", options: ["forget", "keep in memory", "ignore", "reject", "simplify"], answer: "B", explanation: "'Retain information' berarti menyimpan informasi dalam ingatan." },
  { id: 219, textId: "t30", type: "single", level: "C4", question: "What can be inferred from the statement that students 'engage with the material actively rather than passively listening to lectures'?", options: ["Active engagement leads to better understanding than passive listening", "Lectures are completely useless in education", "Passive listening always results in better grades", "Active engagement requires no teacher guidance at all", "Students learn best when working alone"], answer: "A", explanation: "Keterlibatan aktif membantu siswa memahami materi lebih dalam dibandingkan hanya mendengarkan secara pasif." },
  { id: 220, textId: "t30", type: "single", level: "C3", question: "According to paragraph 3, what skills does project-based learning help develop?", options: ["Only technical computer skills", "Collaboration, critical thinking, and time management", "Public speaking skills exclusively", "Artistic and musical skills", "Foreign language proficiency"], answer: "B", explanation: "Pembelajaran berbasis proyek mengembangkan keterampilan kolaborasi, berpikir kritis, dan manajemen waktu." },
  { id: 221, textId: "t30", type: "multi", question: "According to the text, which of the following are advantages of project-based learning mentioned by the writer? (Choose TWO)", options: ["It encourages deeper understanding of concepts", "It eliminates the need for teachers entirely", "It increases student motivation and engagement", "It guarantees higher exam scores for all students", "It removes the need for deadlines"], answers: ["A","C"], explanation: "Keunggulan yang disebutkan meliputi pemahaman konsep yang lebih mendalam dan peningkatan motivasi serta keterlibatan siswa." },
  { id: 222, textId: "t30", type: "table", question: "Based on the text, decide whether each statement is APPROPRIATE (Tepat) or NOT APPROPRIATE (Tidak Tepat).", statements: ["The writer believes traditional teaching methods should be used alongside project-based learning.", "Project-based learning typically involves students working in teams.", "The writer claims memorization is more effective than project-based learning.", "Project-based learning can help prepare students for future careers."], answersTable: [true, true, false, true], explanation: "(1) Tepat. (2) Tepat. (3) Tidak Tepat — penulis mendukung pembelajaran berbasis proyek. (4) Tepat." },

  { id: 223, textId: "t31", type: "single", level: "C2", question: "What is the purpose of this email?", options: ["To request a refund for rent already paid", "To report a water leak and request repair", "To complain about noisy neighbors", "To request an early termination of the rental contract", "To ask about the building's parking policy"], answer: "B", explanation: "Email ini ditulis untuk melaporkan kebocoran air dan meminta perbaikan segera." },
  { id: 224, textId: "t31", type: "single", level: "C3", question: "According to the email, where is the water leak located?", options: ["In the kitchen sink", "Near the ceiling by the shower area in the bathroom", "In the living room window", "Under the front door", "In the parking garage"], answer: "B", explanation: "Kebocoran berasal dari langit-langit di dekat area shower kamar mandi." },
  { id: 225, textId: "t31", type: "single", level: "C4", question: "What can be inferred about why Dimas attached photos to the email?", options: ["To show the overall design of his apartment", "To provide visual evidence of the damage for the management's reference", "To request an interior design consultation", "To compare his unit with a neighboring unit", "To document the furniture in his apartment"], answer: "B", explanation: "Foto dilampirkan sebagai bukti visual kerusakan agar pihak manajemen memahami kondisi sebenarnya." },
  { id: 226, textId: "t31", type: "multi", question: "According to the email, when is Dimas generally available for the inspection? (Choose TWO)", options: ["Weekday evenings after 18.00", "Weekday mornings before 08.00", "Anytime during the weekend", "Only on public holidays", "During his lunch break at work"], answers: ["A","C"], explanation: "Dimas menyebutkan ia umumnya tersedia pada sore hari setelah pukul 18.00 di hari kerja, atau kapan saja di akhir pekan." },
  { id: 227, textId: "t31", type: "table", question: "Based on the email, decide whether each statement is TRUE or FALSE.", statements: ["Dimas first noticed the leak three days before sending the email.", "Dimas had never reported the issue before sending this email.", "The affected area has grown larger since it was first noticed.", "Dimas lives in Unit 12B."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — ia sudah melaporkannya secara informal sebelumnya. (3) Benar. (4) Benar." },

  { id: 228, textId: "t32", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The stages and importance of the water cycle", "The causes of ocean pollution", "How to conserve water at home", "The history of water usage in agriculture", "The formation of underground rivers"], answer: "A", explanation: "Teks report ini menjelaskan tahapan siklus air serta pentingnya proses tersebut." },
  { id: 229, textId: "t32", type: "single", level: "C3", question: "The word 'condensation' in paragraph 3 is closest in meaning to...", options: ["the process of water vapor turning into droplets as it cools", "the process of ice melting into liquid water", "the process of water flowing into rivers", "the process of plants absorbing water", "the process of water evaporating from the ocean"], answer: "A", explanation: "'Condensation' merujuk pada proses uap air berubah menjadi tetesan air saat mendingin." },
  { id: 230, textId: "t32", type: "single", level: "C4", question: "What can be inferred about the role of aquifers mentioned in paragraph 4?", options: ["They release water directly into the atmosphere", "They serve as underground storage for groundwater", "They are only found near oceans", "They prevent all forms of flooding", "They are man-made structures for irrigation"], answer: "B", explanation: "Akuifer berfungsi sebagai penyimpanan air tanah bawah permukaan." },
  { id: 231, textId: "t32", type: "multi", question: "According to the text, which of the following are stages or processes in the water cycle? (Choose TWO)", options: ["Evaporation", "Photosynthesis", "Condensation", "Fermentation", "Combustion"], answers: ["A","C"], explanation: "Tahapan yang disebutkan meliputi evaporasi dan kondensasi." },
  { id: 232, textId: "t32", type: "table", question: "Based on the text, decide whether each statement is TRUE or FALSE.", statements: ["Plants contribute to the water cycle through transpiration.", "Precipitation can occur in the form of rain, snow, or hail.", "Human activities have no effect on the water cycle.", "Surface runoff eventually reaches rivers, lakes, and oceans."], answersTable: [true, true, false, true], explanation: "(1) Benar. (2) Benar. (3) Salah — aktivitas manusia dapat mengganggu siklus air. (4) Benar." },

  { id: 233, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in meaning to 'ample'.", options: ["insufficient", "plentiful", "scarce", "limited", "minimal"], answer: "B", explanation: "'Ample' berarti cukup banyak/berlimpah." },
  { id: 234, textId: null, type: "single", level: "C2", question: "Choose the word that is closest in OPPOSITE meaning (antonym) to 'concise'.", options: ["brief", "wordy", "clear", "short", "precise"], answer: "B", explanation: "'Concise' berarti singkat dan padat, sehingga lawan katanya adalah 'wordy'." },
  { id: 235, textId: null, type: "single", level: "C3", question: "The volunteers decided to hand out flyers about the upcoming charity event. The phrasal verb 'hand out' means...", options: ["to collect", "to distribute", "to design", "to throw away", "to sell"], answer: "B", explanation: "'Hand out' berarti membagikan sesuatu kepada banyak orang." },
  { id: 236, textId: null, type: "single", level: "C3", question: "Choose the best logical connector: 'The government increased funding for public schools; ____, the quality of education began to improve.'", options: ["as a result", "on the contrary", "in other words", "for instance", "nevertheless"], answer: "A", explanation: "Kalimat kedua adalah akibat logis dari kalimat pertama." },
  { id: 237, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The engineers tested the new bridge carefully before declaring ____ safe for public use.'", options: ["it", "they", "them", "these", "him"], answer: "A", explanation: "Kata ganti 'it' merujuk pada 'the new bridge' yang bersifat tunggal dan benda." },
  { id: 238, textId: null, type: "single", level: "C4", question: "'Despite facing several technical difficulties, the team launched the product on schedule.' What does this sentence imply?", options: ["The product launch was delayed due to technical issues", "The team succeeded in launching on time despite the difficulties", "The product was cancelled because of technical problems", "The technical difficulties were resolved months in advance", "The team decided not to launch the product at all"], answer: "B", explanation: "'Despite' menunjukkan kontras: meskipun menghadapi kesulitan teknis, tim tetap meluncurkan produk tepat waktu." },
  { id: 239, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'crucial'? (Choose TWO)", options: ["vital", "trivial", "essential", "minor", "unimportant"], answers: ["A","C"], explanation: "'Crucial' berarti sangat penting, sinonimnya adalah 'vital' dan 'essential'." },
  { id: 240, textId: null, type: "table", question: "Decide whether each sentence uses the phrasal verb CORRECTLY (Sesuai) or INCORRECTLY (Tidak Sesuai) based on its intended meaning in brackets.", statements: ["The company decided to team up with a local charity for the campaign. [collaborate]", "He tends to put down his colleagues' ideas during meetings. [praises]", "The researchers had to narrow down the list of possible causes. [reduce]", "She always looks forward to visiting her hometown during the holidays. [anticipates happily]"], answersTable: [true, false, true, true], explanation: "(1) Sesuai — 'team up with' berarti berkolaborasi. (2) Tidak Sesuai — 'put down' berarti merendahkan, bukan memuji. (3) Sesuai — 'narrow down' berarti mempersempit. (4) Sesuai — 'look forward to' berarti menantikan dengan senang." }

  { id: 245, textId: "t33", type: "multi", question: "According to the text, which of the following are TRUE? (Choose TWO)", options: ["Kopi was adopted by a family with two young children", "The writer volunteered for one full month", "The writer felt sad and regretful about Kopi's adoption", "The shelter organized an adoption event during the second week", "The writer refused to help during the adoption event"], answers: ["A","D"], explanation: "Kopi diadopsi oleh keluarga dengan dua anak kecil, dan penampungan mengadakan acara adopsi pada minggu kedua." },

  { id: 248, textId: "t34", type: "single", level: "C3", question: "The word 'deprivation' in paragraph 2 is closest in meaning to...", options: ["excess", "lack of something needed", "improvement", "regulation", "celebration"], answer: "B", explanation: "'Sleep deprivation' berarti kekurangan tidur." },
  { id: 249, textId: "t34", type: "single", level: "C4", question: "What can be inferred from the statement that 'sleep quality is just as important as sleep duration'?", options: ["Sleeping for a long time always guarantees good health", "Interrupted sleep, even if long in duration, may not be fully restorative", "Sleep duration is irrelevant to overall health", "Only teenagers need to worry about sleep quality", "Sleep quality cannot be measured or observed"], answer: "B", explanation: "Tidur yang sering terganggu, meskipun berdurasi panjang, mungkin tidak memberikan pemulihan yang optimal." },
  { id: 250, textId: "t34", type: "single", level: "C3", question: "According to the text, how many hours of sleep do teenagers typically need per night?", options: ["Five to six hours", "Six to seven hours", "Eight to ten hours", "Ten to twelve hours", "Four to five hours"], answer: "C", explanation: "Remaja umumnya membutuhkan delapan hingga sepuluh jam tidur per malam." },
  { id: 251, textId: "t34", type: "multi", question: "According to the text, which of the following are recommended to improve sleep quality? (Choose TWO)", options: ["Maintaining a consistent sleep schedule", "Increasing screen time before bed", "Limiting screen time before bed", "Sleeping in a noisy environment", "Skipping sleep on weekends to catch up on work"], answers: ["A","C"], explanation: "Menjaga jadwal tidur konsisten dan membatasi waktu layar sebelum tidur direkomendasikan untuk meningkatkan kualitas tidur." },

  { id: 254, textId: "t35", type: "single", level: "C3", question: "According to the text, what should be done immediately after tying the two sticks together?", options: ["Attach the tail to the kite", "Cut a small notch at each end of both sticks and run string around them", "Fly the kite for the first time", "Cut around the paper frame", "Tie the flying string to the kite"], answer: "B", explanation: "Setelah kedua tongkat diikat, langkah selanjutnya adalah membuat takik kecil di setiap ujung tongkat dan menarik tali di sekelilingnya." },

  { id: 258, textId: "t36", type: "single", level: "C2", question: "What is the purpose of this announcement?", options: ["To announce the closing of the school cafeteria", "To inform students and parents about changes to the cafeteria menu policy", "To announce new cafeteria staff", "To request donations for the cafeteria renovation", "To cancel the school's meal program entirely"], answer: "B", explanation: "Pengumuman ini menginformasikan perubahan kebijakan menu kantin sekolah." },

  { id: 260, textId: "t36", type: "single", level: "C4", question: "What can be inferred about why the cafeteria worked with a licensed nutritionist?", options: ["To reduce the cost of ingredients", "To ensure the new menu is both nutritious and appealing to students", "To design new cafeteria furniture", "To train new cafeteria staff members", "To create a marketing campaign for the cafeteria"], answer: "B", explanation: "Kerja sama dengan ahli gizi bertujuan memastikan menu baru tetap bergizi dan menarik bagi siswa." },
  { id: 261, textId: "t36", type: "multi", question: "According to the announcement, which of the following are changes to the cafeteria menu? (Choose TWO)", options: ["A new fruit and vegetable station will be available daily", "Sugary drinks will be completely banned from the school", "Sugary drinks will be replaced with reduced-sugar options", "Fried snacks will be available every day", "The cafeteria will only serve vegetarian food"], answers: ["A","C"], explanation: "Perubahan meliputi stasiun buah dan sayur harian, serta penggantian minuman manis dengan opsi rendah gula." },
  { id: 262, textId: "t36", type: "table", question: "Based on the announcement, decide whether each statement is TRUE or FALSE.", statements: ["The new policy takes effect from 17 August 2026.", "The fruit and vegetable station requires an additional fee.", "Students with allergies are encouraged to inform the cafeteria staff.", "This policy change was based on a health survey conducted last semester."], answersTable: [true, false, true, true], explanation: "(1) Benar. (2) Salah — tanpa biaya tambahan. (3) Benar. (4) Benar." },

  { id: 267, textId: null, type: "single", level: "C4", question: "Choose the correct reference word: 'The scientists analyzed the data carefully before presenting ____ findings to the public.'", options: ["its", "their", "his", "her", "this"], answer: "B", explanation: "Kata ganti kepemilikan 'their' merujuk pada 'the scientists' yang bersifat jamak." },
  { id: 268, textId: null, type: "single", level: "C4", question: "'Even though the instructions were translated poorly, most users managed to assemble the furniture correctly.' What does this sentence imply?", options: ["The poor translation prevented users from assembling the furniture", "Most users succeeded despite the poorly translated instructions", "The furniture could not be assembled at all", "The instructions were rewritten before users received them", "All users returned the furniture due to confusion"], answer: "B", explanation: "'Even though' menunjukkan kontras: meskipun instruksinya diterjemahkan dengan buruk, sebagian besar pengguna tetap berhasil merakit furnitur." },
  { id: 269, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'assist'? (Choose TWO)", options: ["help", "hinder", "support", "obstruct", "prevent"], answers: ["A","C"], explanation: "'Assist' berarti membantu, sinonimnya adalah 'help' dan 'support'." },

  { id: 279, textId: "t38", type: "single", level: "C4", question: "What can be inferred from the statement that financial problems are 'a significant source of stress for adults'?", options: ["Financial literacy has no connection to mental health", "Managing finances well may help reduce stress levels in adulthood", "Stress is always caused by financial issues alone", "Adults with financial knowledge never experience stress", "Financial stress only affects people with low income"], answer: "B", explanation: "Kemampuan mengelola keuangan dengan baik dapat membantu mengurangi tingkat stres di masa dewasa." },
  { id: 280, textId: "t38", type: "single", level: "C3", question: "According to paragraph 2, what is one benefit of learning to create a budget?", options: ["It guarantees a higher salary in the future", "It helps teenagers develop responsible spending habits", "It eliminates the need for saving money", "It replaces the need for a formal education", "It allows teenagers to avoid paying taxes"], answer: "B", explanation: "Belajar membuat anggaran membantu remaja mengembangkan kebiasaan berbelanja yang bertanggung jawab." },
  { id: 281, textId: "t38", type: "multi", question: "According to the text, which of the following are benefits of financial literacy education mentioned by the writer? (Choose TWO)", options: ["Developing responsible spending habits", "Guaranteeing admission to university", "Making informed decisions about saving and investment", "Eliminating the need for part-time jobs", "Preventing all forms of economic recession"], answers: ["A","C"], explanation: "Manfaat yang disebutkan meliputi pengembangan kebiasaan berbelanja yang bertanggung jawab dan kemampuan mengambil keputusan terkait tabungan dan investasi." },

  { id: 283, textId: "t39", type: "single", level: "C2", question: "What is the purpose of this email?", options: ["To thank a teacher for a completed course", "To request a reference letter for a university scholarship application", "To ask for extra tutoring sessions", "To request a copy of an old research project", "To apply for a teaching position"], answer: "B", explanation: "Email ini ditulis untuk meminta surat rekomendasi dari mantan gurunya guna keperluan aplikasi beasiswa universitas." },
  { id: 284, textId: "t39", type: "single", level: "C3", question: "According to the email, why did Farrel choose to ask Bu Ratna specifically?", options: ["She is the only teacher available at the school", "Her class inspired his interest in environmental studies", "She promised to write the letter earlier", "She is the school principal", "She taught him for only one semester"], answer: "B", explanation: "Kelas Bu Ratna menginspirasi minat Farrel pada studi lingkungan, terutama melalui proyek penelitian tentang polusi sungai." },

  { id: 286, textId: "t39", type: "multi", question: "According to the email, which of the following did Farrel offer to provide? (Choose TWO)", options: ["His transcript", "A financial contribution", "His personal statement", "A recommendation from another teacher", "A copy of his high school diploma"], answers: ["A","C"], explanation: "Farrel menawarkan mengirimkan transkrip nilai dan personal statement." },
  { id: 287, textId: "t39", type: "table", question: "Based on the email, decide whether each statement is TRUE or FALSE.", statements: ["Farrel graduated from SMA Nusantara in 2025.", "The reference letter must be submitted by 20 September 2026.", "Farrel completed a research project on river pollution under Bu Ratna's guidance.", "Farrel demanded that Bu Ratna respond within 24 hours."], answersTable: [true, false, true, false], explanation: "(1) Benar. (2) Salah — batas pengumpulan surat 15 September, batas akhir aplikasi 20 September. (3) Benar. (4) Salah." },

  { id: 288, textId: "t40", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The history of paper production", "The step-by-step process and benefits of recycling paper", "The chemical composition of paper", "A comparison between paper and plastic packaging", "The economics of the paper industry"], answer: "B", explanation: "Teks report ini menjelaskan tahapan proses daur ulang kertas serta manfaat lingkungannya." },
  { id: 289, textId: "t40", type: "single", level: "C3", question: "The word 'slurry' in paragraph 3 is closest in meaning to...", options: ["a solid block of paper", "a soft, wet, pulpy mixture", "a type of chemical dye", "a finished sheet of paper", "a type of recycling machine"], answer: "B", explanation: "'Slurry' merujuk pada campuran lunak dan basah dari kertas yang dicampur air dan bahan kimia." },
  { id: 290, textId: "t40", type: "single", level: "C4", question: "What can be inferred from the statement that 'paper fibers can only be recycled a limited number of times'?", options: ["Paper can be recycled infinitely without any quality loss", "Recycling alone cannot completely replace the need for responsible paper use", "New paper should never be produced from raw materials", "Paper fibers become stronger each time they are recycled", "Recycling paper is harmful to the environment"], answer: "B", explanation: "Daur ulang saja tidak cukup, sehingga konsumsi kertas yang bertanggung jawab tetap penting." },
  { id: 291, textId: "t40", type: "multi", question: "According to the text, which of the following are environmental benefits of paper recycling mentioned by the writer? (Choose TWO)", options: ["Reduced deforestation", "Increased use of raw materials", "Lower energy consumption compared to producing paper from raw materials", "Elimination of all landfill waste", "Faster paper production speed"], answers: ["A","C"], explanation: "Manfaat yang disebutkan meliputi berkurangnya penebangan hutan dan konsumsi energi yang lebih rendah." },

  { id: 298, textId: null, type: "single", level: "C4", question: "'Although the hiking trail was steep and exhausting, the group reached the summit before sunset.' What does this sentence imply?", options: ["The group gave up before reaching the summit", "The group succeeded in reaching the top despite the difficult trail", "The trail was actually flat and easy", "The group reached the summit after sunset", "The hike was cancelled due to exhaustion"], answer: "B", explanation: "'Although' menunjukkan kontras: meskipun jalur pendakiannya curam dan melelahkan, kelompok tersebut tetap berhasil mencapai puncak." },

  { id: 307, textId: "t42", type: "single", level: "C2", question: "What is the text mainly about?", options: ["The history of park design in cities", "The environmental, social, and health benefits of urban green spaces", "How to plant trees in urban areas", "The economic cost of maintaining public parks", "A comparison between rural and urban lifestyles"], answer: "B", explanation: "Teks report ini menjelaskan berbagai manfaat lingkungan, sosial, dan kesehatan dari ruang hijau perkotaan." },

  { id: 309, textId: "t42", type: "single", level: "C4", question: "What can be inferred from the statement that access to nature is 'not merely a luxury but an essential component of healthy urban living'?", options: ["Green spaces are only important for wealthy neighborhoods", "Green spaces should be considered a basic necessity for urban residents", "Green spaces have no measurable impact on health", "Urban planning should avoid including green spaces", "Green spaces are optional additions with little real value"], answer: "B", explanation: "Ruang hijau seharusnya dianggap sebagai kebutuhan dasar, bukan sekadar kemewahan tambahan." },
  { id: 310, textId: "t42", type: "single", level: "C3", question: "According to paragraph 4, what mental health benefit is associated with spending time in green spaces?", options: ["Increased appetite", "Reduced stress, anxiety, and mental fatigue", "Improved eyesight", "Better memory for numerical facts", "Reduced need for sleep"], answer: "B", explanation: "Menghabiskan waktu di lingkungan alami dapat membantu mengurangi stres, kecemasan, dan kelelahan mental." },
  { id: 311, textId: "t42", type: "multi", question: "According to the text, which of the following are benefits of urban green spaces mentioned by the writer? (Choose TWO)", options: ["Improving air quality", "Eliminating all forms of urban pollution", "Providing spaces for community interaction and recreation", "Guaranteeing lower housing prices", "Preventing all natural disasters"], answers: ["A","C"], explanation: "Manfaat yang disebutkan meliputi peningkatan kualitas udara dan penyediaan ruang untuk interaksi sosial serta rekreasi." },

  { id: 328, textId: null, type: "single", level: "C4", question: "'Even though the internet connection was unstable, the online meeting proceeded smoothly.' What does this sentence imply?", options: ["The meeting was cancelled due to connection problems", "The meeting continued without major issues despite the unstable connection", "The internet connection improved before the meeting started", "The meeting was rescheduled to another day", "No one attended the meeting because of the poor connection"], answer: "B", explanation: "'Even though' menunjukkan kontras: meskipun koneksi internet tidak stabil, rapat daring tetap berjalan lancar." },
  { id: 329, textId: null, type: "multi", question: "Which of the following words are SYNONYMS of 'diligent'? (Choose TWO)", options: ["hardworking", "lazy", "industrious", "careless", "idle"], answers: ["A","C"], explanation: "'Diligent' berarti rajin/tekun, sinonimnya adalah 'hardworking' dan 'industrious'." },
